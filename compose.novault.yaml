# Local development override: run the stack without Vault.
#
#   docker compose -f compose.yaml -f compose.novault.yaml up -d
#
# WHY THIS EXISTS
# ---------------
# Vault starts sealed. Nothing unseals it automatically, so after a cold boot
# `runtime-configuration-init` fails and the whole app profile refuses to start
# until someone runs `scripts/vault/bootstrap_local_vault.py` by hand. That is
# the one part of cold-start recovery that is not automatic.
#
# WHY IT IS AN OVERRIDE AND NOT A DEFAULT
# ---------------------------------------
# Vault secret resolution is a deliberate property of this platform, not an
# accident, and `Settings.validate_relationships` refuses to start in production
# without it. Nothing here changes that: the base `compose.yaml` is untouched and
# production still requires Vault. This file only exists so a developer can trade
# that away knowingly, on a local stack, for a faster loop.
#
# WHAT IT ACTUALLY DOES
# ---------------------
# `compose.yaml` sets seven credentials to the sentinel values `vault-resolved`
# and `vault-resolved.invalid`, which are correct ONLY because Vault replaces
# them at startup. Turning Vault off without replacing them would leave those
# strings as the real credentials and every connection would fail. So this file
# supplies all seven from the host `.env` and clears the `*_SECRET_REFERENCE`
# variables, because a reference left behind would be resolved by a resolver that
# is no longer there.
#
# The values come from the same `.env` the datastore containers are configured
# with, so they match by construction rather than by being copied.
#
# SECURITY NOTE
# -------------
# This puts real credentials in the container environment instead of a sealed
# store. On this stack they are auto-generated values bound to 127.0.0.1 and
# already accepted as low risk by the repository owner. Do not carry this file to
# an environment where that is not true.

x-novault-environment: &novault-environment
  PLATFORM_VAULT_ENABLED: "false"

  # Real values, replacing the sentinels the resolver would have overwritten.
  PLATFORM_MONGO_DSN: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${PLATFORM_MONGO_DATABASE:-return_platform}?authSource=admin&directConnection=true
  PLATFORM_SOURCE_MONGO_DSN: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${PLATFORM_SOURCE_MONGO_DATABASE:-return_source}?authSource=admin&directConnection=true
  PLATFORM_NEO4J_PASSWORD: ${GRAPH_PASSWORD}
  PLATFORM_VALKEY_PASSWORD: ${VALKEY_PASSWORD}
  PLATFORM_SQLSERVER_PASSWORD: ${MSSQL_SA_PASSWORD}
  PLATFORM_VALIDATION_FINGERPRINT_KEY: ${PLATFORM_VALIDATION_FINGERPRINT_KEY}
  PLATFORM_CONTACT_LOOKUP_HMAC_KEY: ${PLATFORM_CONTACT_LOOKUP_HMAC_KEY}

  # Cleared deliberately. A `vault://` reference with no resolver behind it is
  # worse than no reference: it looks configured and resolves to nothing.
  PLATFORM_MONGO_DSN_SECRET_REFERENCE: ""
  PLATFORM_SOURCE_MONGO_DSN_SECRET_REFERENCE: ""
  PLATFORM_NEO4J_PASSWORD_SECRET_REFERENCE: ""
  PLATFORM_VALKEY_PASSWORD_SECRET_REFERENCE: ""
  PLATFORM_SQLSERVER_PASSWORD_SECRET_REFERENCE: ""
  PLATFORM_VALIDATION_FINGERPRINT_KEY_SECRET_REFERENCE: ""
  PLATFORM_CONTACT_LOOKUP_HMAC_KEY_SECRET_REFERENCE: ""

services:
  runtime-configuration-init:
    environment: *novault-environment
  backend:
    environment: *novault-environment
  return-workflow-worker:
    environment: *novault-environment
  order-discovery-worker:
    environment: *novault-environment
  return-orchestrator:
    environment: *novault-environment
  outbox-publisher:
    environment: *novault-environment
  integration-outbox-worker:
    environment: *novault-environment
  housekeeping-worker:
    environment: *novault-environment
  seed-runner:
    environment: *novault-environment
