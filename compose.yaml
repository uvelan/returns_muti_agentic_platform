name: return-multi-agent-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-platform-environment: &platform-environment
  PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT:-development}
  PLATFORM_FRONTEND_CORS_ORIGIN: ${PLATFORM_CONTAINER_FRONTEND_CORS_ORIGIN:-http://localhost:3200}
  PLATFORM_CATALOG_PATH: /app/config/data_assets.yaml
  PLATFORM_SCHEMA_REGISTRY_PATH: /app/config/schema_registry.yaml
  PLATFORM_RETURN_CONFIGURATION_PATH: /app/config/returns/production.yaml
  PLATFORM_DEPENDENCY_SIMULATION_CONFIGURATION_PATH: /app/config/dependency_simulation.yaml
  PLATFORM_AI_GATEWAY_CONFIGURATION_PATH: /app/config/ai_gateway.yaml
  PLATFORM_VALIDATE_AI_ON_STARTUP: ${PLATFORM_VALIDATE_AI_ON_STARTUP:-false}
  PLATFORM_DYNAMIC_ORDER_AGENT_ENABLED: ${PLATFORM_DYNAMIC_ORDER_AGENT_ENABLED:-true}
  PLATFORM_DYNAMIC_KNOWLEDGE_SCHEMA_PATH: /app/config/dynamic_knowledge/active-schema.return-order.yaml
  # The seventh sibling, and it was the only one missing. Every DEFAULT_*_PATH in
  # settings.py hangs off BACKEND_ROOT = parents[3] of the settings module, which
  # is correct from a source checkout and wrong inside the image: the runtime
  # stage copies `config` and `scripts` but never `src`, so PYTHONPATH=/app/src
  # dangles, `return_platform` imports from site-packages, and BACKEND_ROOT
  # becomes /usr/local/lib/python3.13. The other six are overridden above and so
  # never noticed; this one was not, so it resolved to a path that does not exist
  # while the manifest ships at /app/config/platform/system_store.yaml.
  #
  # Consequences were severe and quiet: order-discovery-worker and
  # return-orchestrator crash-looped, leaving two required process classes with
  # zero live instances so adoption could never reach LIVE -- and main.py caught
  # the same error, degrading the Graph Schema Analyzer and leaving
  # `interception_store` None, which removes the durable store behind the AI
  # interception gate, all while /health/ready still answered "ready".
  PLATFORM_SYSTEM_STORE_MANIFEST_PATH: /app/config/platform/system_store.yaml
  # The eighth, and the reason the note above did not end the class. The seven
  # siblings are single files; this is the config *tree* the manifest-driven
  # loader walks, and it was not a setting at all -- `main.py` handed
  # `BACKEND_ROOT / "config"` to the agent configuration service directly, so no
  # env var could reach it. Same wrong path, quieter symptom: the Configuration
  # screen's Agents section 500s on `GET /api/agents` and the console renders
  # "Loading..." forever, in every container, with the suite green because tests
  # run from the checkout where BACKEND_ROOT is correct.
  PLATFORM_CONFIGURATION_DIRECTORY: /app/config
  PLATFORM_PROBE_TIMEOUT_SECONDS: ${PLATFORM_PROBE_TIMEOUT_SECONDS:-5}
  PLATFORM_DEPENDENCY_CONNECT_TIMEOUT_SECONDS: ${PLATFORM_DEPENDENCY_CONNECT_TIMEOUT_SECONDS:-10}
  PLATFORM_OPERATION_TIMEOUT_SECONDS: ${PLATFORM_OPERATION_TIMEOUT_SECONDS:-15}
  # Runtime credentials come from the process environment, read from the one
  # `.env` the datastore containers are configured with, so they match by
  # construction rather than by being copied.
  #
  # The DSNs are taken whole rather than assembled from `${MONGO_ROOT_*}` here:
  # a password containing `%`, `@` or `!` must be percent-encoded inside a
  # mongodb:// URI and Compose interpolation cannot encode anything, so a DSN
  # built in this file works only for passwords that happen not to need it.
  # `scripts/linux/ensure_local_infrastructure_secrets.py` derives all four
  # DSNs from the one root credential, correctly quoted. The CONTAINER_ pair
  # differs from the host pair only in naming `mongodb` instead of localhost.
  PLATFORM_MONGO_DSN: ${PLATFORM_CONTAINER_MONGO_DSN:?set it by running scripts/linux/ensure_local_infrastructure_secrets.py}
  PLATFORM_MONGO_DATABASE: ${PLATFORM_MONGO_DATABASE:-return_platform}
  PLATFORM_SOURCE_MONGO_DSN: ${PLATFORM_CONTAINER_SOURCE_MONGO_DSN:?set it by running scripts/linux/ensure_local_infrastructure_secrets.py}
  PLATFORM_SOURCE_MONGO_DATABASE: ${PLATFORM_SOURCE_MONGO_DATABASE:-return_source}
  PLATFORM_GRAPH_EVIDENCE_COLLECTION: ${PLATFORM_GRAPH_EVIDENCE_COLLECTION:-graph_evidence_runs}
  PLATFORM_GRAPH_EVIDENCE_QUERY_TIMEOUT_SECONDS: ${PLATFORM_GRAPH_EVIDENCE_QUERY_TIMEOUT_SECONDS:-5}
  PLATFORM_GRAPH_SYNC_BATCH_SIZE: ${PLATFORM_GRAPH_SYNC_BATCH_SIZE:-250}
  PLATFORM_GRAPH_SYNC_MAX_RECORDS: ${PLATFORM_GRAPH_SYNC_MAX_RECORDS:-10000}
  PLATFORM_AI_STUDIO_MAX_RECORDS: ${PLATFORM_AI_STUDIO_MAX_RECORDS:-500}
  PLATFORM_AI_STUDIO_MONGO_DATABASE: ${PLATFORM_AI_STUDIO_MONGO_DATABASE:-ai_studio_validation}
  PLATFORM_SUPPORT_TICKET_MODE: ${PLATFORM_SUPPORT_TICKET_MODE:-INTERNAL}
  PLATFORM_SUPPORT_TICKET_BASE_URL: ${PLATFORM_SUPPORT_TICKET_BASE_URL:-}
  PLATFORM_SUPPORT_TICKET_API_KEY: ${PLATFORM_SUPPORT_TICKET_API_KEY:-}
  PLATFORM_SUPPORT_TICKET_TIMEOUT_SECONDS: ${PLATFORM_SUPPORT_TICKET_TIMEOUT_SECONDS:-15}
  PLATFORM_SUPPORT_TICKET_POLL_SECONDS: ${PLATFORM_SUPPORT_TICKET_POLL_SECONDS:-5}
  PLATFORM_SUPPORT_TICKET_MAX_POLLS: ${PLATFORM_SUPPORT_TICKET_MAX_POLLS:-12}
  PLATFORM_FEEDBACK_LEARNING_ENABLED: ${PLATFORM_FEEDBACK_LEARNING_ENABLED:-true}
  PLATFORM_NEO4J_URI: bolt://neo4j:7687
  PLATFORM_NEO4J_USER: neo4j
  PLATFORM_NEO4J_PASSWORD: ${GRAPH_PASSWORD}
  PLATFORM_NEO4J_DATABASE: ${PLATFORM_NEO4J_DATABASE:-neo4j}
  PLATFORM_VALKEY_HOST: valkey
  PLATFORM_VALKEY_PORT: 6379
  PLATFORM_VALKEY_PASSWORD: ${VALKEY_PASSWORD}
  PLATFORM_EVENT_STREAM_RETENTION: ${PLATFORM_EVENT_STREAM_RETENTION:-10000}
  PLATFORM_SSE_HEARTBEAT_SECONDS: ${PLATFORM_SSE_HEARTBEAT_SECONDS:-15}
  PLATFORM_SSE_REPLAY_LIMIT: ${PLATFORM_SSE_REPLAY_LIMIT:-1000}
  PLATFORM_TEMPORAL_TARGET: temporal:7233
  PLATFORM_RETURN_WORKFLOW_TASK_QUEUE: ${PLATFORM_RETURN_WORKFLOW_TASK_QUEUE:-return-platform-return-v1}
  PLATFORM_ORCHESTRATION_POLL_SECONDS: ${PLATFORM_ORCHESTRATION_POLL_SECONDS:-1}
  PLATFORM_WORKER_READINESS_TTL_SECONDS: ${PLATFORM_WORKER_READINESS_TTL_SECONDS:-30}
  PLATFORM_SQLSERVER_HOST: sqlserver
  PLATFORM_SQLSERVER_PORT: 1433
  PLATFORM_SQLSERVER_USER: sa
  PLATFORM_SQLSERVER_PASSWORD: ${MSSQL_SA_PASSWORD}
  PLATFORM_SQLSERVER_DATABASE: ${PLATFORM_SQLSERVER_DATABASE:-return_platform}
  PLATFORM_AI_PROVIDER_ORDER: ${PLATFORM_AI_PROVIDER_ORDER:-NONE}
  PLATFORM_AI_TIMEOUT_SECONDS: ${PLATFORM_AI_TIMEOUT_SECONDS:-12}
  PLATFORM_AI_GLOBAL_TIMEOUT_SECONDS: ${PLATFORM_AI_GLOBAL_TIMEOUT_SECONDS:-30}
  PLATFORM_AI_MAX_ATTEMPTS_PER_PROVIDER: ${PLATFORM_AI_MAX_ATTEMPTS_PER_PROVIDER:-2}
  PLATFORM_AI_MAX_CONCURRENCY: ${PLATFORM_AI_MAX_CONCURRENCY:-16}
  PLATFORM_AI_REQUESTS_PER_MINUTE: ${PLATFORM_AI_REQUESTS_PER_MINUTE:-120}
  PLATFORM_AI_MAX_PAYLOAD_BYTES: ${PLATFORM_AI_MAX_PAYLOAD_BYTES:-16384}
  PLATFORM_AI_INTERCEPTION_DEFAULT: ${PLATFORM_AI_INTERCEPTION_DEFAULT:-false}
  PLATFORM_AI_PROMPT_VERSION: ${PLATFORM_AI_PROMPT_VERSION:-return-eligibility-v1}
  PLATFORM_AI_ALLOWED_ENDPOINT_HOSTS: ${PLATFORM_AI_ALLOWED_ENDPOINT_HOSTS:-generativelanguage.googleapis.com,integrate.api.nvidia.com,api.openai.com,api.anthropic.com}
  PLATFORM_DATA_SOURCE_ALLOWED_HOSTS: ${PLATFORM_DATA_SOURCE_ALLOWED_HOSTS:-mongodb,source-mongodb,sqlserver,neo4j,localhost,127.0.0.1,::1}
  PLATFORM_DATA_SOURCE_CREDENTIAL_REVEAL_ENABLED: ${PLATFORM_DATA_SOURCE_CREDENTIAL_REVEAL_ENABLED:-false}
  PLATFORM_GOOGLE_API_KEYS: "[]"
  PLATFORM_GOOGLE_API_KEY_REFERENCES: ${PLATFORM_GOOGLE_API_KEY_REFERENCES:-[]}
  PLATFORM_GOOGLE_LIGHTWEIGHT_MODELS: ${PLATFORM_GOOGLE_LIGHTWEIGHT_MODELS:-[]}
  PLATFORM_GOOGLE_STANDARD_MODELS: ${PLATFORM_GOOGLE_STANDARD_MODELS:-[]}
  PLATFORM_GOOGLE_BASE_URL: ${PLATFORM_GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
  PLATFORM_NVIDIA_API_KEYS: "[]"
  PLATFORM_NVIDIA_API_KEY_REFERENCES: ${PLATFORM_NVIDIA_API_KEY_REFERENCES:-[]}
  PLATFORM_NVIDIA_LIGHTWEIGHT_MODELS: ${PLATFORM_NVIDIA_LIGHTWEIGHT_MODELS:-[]}
  PLATFORM_NVIDIA_STANDARD_MODELS: ${PLATFORM_NVIDIA_STANDARD_MODELS:-[]}
  PLATFORM_NVIDIA_BASE_URL: ${PLATFORM_NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
  PLATFORM_OPENAI_API_KEYS: "[]"
  PLATFORM_OPENAI_API_KEY_REFERENCES: ${PLATFORM_OPENAI_API_KEY_REFERENCES:-[]}
  PLATFORM_OPENAI_LIGHTWEIGHT_MODELS: ${PLATFORM_OPENAI_LIGHTWEIGHT_MODELS:-[]}
  PLATFORM_OPENAI_STANDARD_MODELS: ${PLATFORM_OPENAI_STANDARD_MODELS:-[]}
  PLATFORM_OPENAI_BASE_URL: ${PLATFORM_OPENAI_BASE_URL:-https://api.openai.com/v1}
  PLATFORM_OPENAI_MODEL: ${PLATFORM_OPENAI_MODEL:-}
  PLATFORM_ANTHROPIC_API_KEYS: "[]"
  PLATFORM_ANTHROPIC_API_KEY_REFERENCES: ${PLATFORM_ANTHROPIC_API_KEY_REFERENCES:-[]}
  PLATFORM_ANTHROPIC_LIGHTWEIGHT_MODELS: ${PLATFORM_ANTHROPIC_LIGHTWEIGHT_MODELS:-[]}
  PLATFORM_ANTHROPIC_STANDARD_MODELS: ${PLATFORM_ANTHROPIC_STANDARD_MODELS:-[]}
  PLATFORM_ANTHROPIC_BASE_URL: ${PLATFORM_ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
  PLATFORM_ANTHROPIC_MODEL: ${PLATFORM_ANTHROPIC_MODEL:-}
  PLATFORM_ANTHROPIC_VERSION: ${PLATFORM_ANTHROPIC_VERSION:-2023-06-01}
  PLATFORM_OLLAMA_BASE_URL: ${PLATFORM_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
  PLATFORM_OLLAMA_MODEL: ${PLATFORM_OLLAMA_MODEL:-}
  PLATFORM_SEED_VERSION: ${PLATFORM_SEED_VERSION:-e2e-v2}
  PLATFORM_SEED_RECORD_LIMIT: ${PLATFORM_SEED_RECORD_LIMIT:-}
  PLATFORM_AUDIT_RETENTION_DAYS: ${PLATFORM_AUDIT_RETENTION_DAYS:-90}
  PLATFORM_VALIDATION_FINGERPRINT_KEY: ${PLATFORM_VALIDATION_FINGERPRINT_KEY}
  PLATFORM_CONTACT_LOOKUP_HMAC_KEY: ${PLATFORM_CONTACT_LOOKUP_HMAC_KEY}

x-backend-base: &backend-base
  image: return-platform-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      # Set EXTRA_CA_CERTS to a PEM root certificate when the network terminates
      # TLS in the middle; otherwise every package download in the build fails
      # on `unable to get local issuer certificate`. Empty is the normal case.
      EXTRA_CA_CERTS: ${EXTRA_CA_CERTS:-}
  environment: *platform-environment
  restart: unless-stopped
  init: true
  networks: [platform]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging: *default-logging

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2025-CU4-ubuntu-22.04}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: 3072
      MSSQL_TRACE_FLAGS: "3459"
    ports:
      # 11433, not 14330. On Windows, WinNAT reserves blocks of ephemeral ports
      # and 14330 falls inside 14267-14366 on this host, so Docker's host bind
      # fails -- silently. The container still reports **healthy**, because its
      # healthcheck runs inside the container and never touches the host
      # interface, and `docker compose ps` shows a green stack whose SQL Server
      # nothing on the host can reach. Every host process then dies on
      # "SQL Server did not become reachable" and the stack looks broken for a
      # reason nothing in it reports.
      #
      # This is the second time: Temporal moved off 7233 for the identical
      # reason (7147-7246). Reserved blocks differ per machine and change across
      # reboots, so if a datastore is unreachable while its container is healthy,
      # check `netsh interface ipv4 show excludedportrange protocol=tcp` before
      # anything else, and compare `docker port <container>` against this file --
      # an empty result there is the whole diagnosis.
      #
      # **Driven by the same variable the application reads, and that is the
      # point.** Hardcoding 11433 here fixed one Windows host and broke every
      # Linux one: `.env` is gitignored, so a machine whose
      # `PLATFORM_SQLSERVER_PORT` still said 14330 kept dialling 14330 while this
      # file published 11433, and the app died on "SQL Server did not become
      # reachable" against a container that was healthy and listening. A
      # published port and the port the client dials cannot be two separate
      # facts. Containers are unaffected either way -- they reach
      # `sqlserver:1433` on the compose network, never the host interface.
      - "127.0.0.1:${PLATFORM_SQLSERVER_PORT:-11433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [platform]
    logging: *default-logging
    mem_limit: 4g

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2025-CU4-ubuntu-22.04}
    user: root
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        for attempt in $$(seq 1 30); do
          /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -d master -Q "IF DB_ID(N'return_platform') IS NULL CREATE DATABASE [return_platform]" >/dev/null 2>&1 || true
          database_state="$$( (/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -d master -h -1 -W -Q "SET NOCOUNT ON; SELECT state_desc FROM sys.databases WHERE name = N'return_platform'" 2>/dev/null || true) | tr -d '\r' | xargs)"
          if [ "$${database_state}" = "ONLINE" ]; then
            break
          fi
          if [ "$${attempt}" -eq 30 ]; then
            echo "return_platform did not become online after 30 attempts" >&2
            exit 1
          fi
          sleep 5
        done
    restart: "no"
    networks: [platform]
    logging: *default-logging

  mongodb:
    image: mongo:${MONGO_VERSION:-8.0.26-noble}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY}
    entrypoint:
      - bash
      - -c
      - |
        printf '%s' "$${MONGO_REPLICA_SET_KEY}" > /data/configdb/keyfile
        chmod 400 /data/configdb/keyfile
        chown 999:999 /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/configdb/keyfile --wiredTigerCacheSizeGB 1
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [platform]
    logging: *default-logging
    mem_limit: 2g

  mongodb-rs-init:
    image: mongo:${MONGO_VERSION:-8.0.26-noble}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        mongosh --host mongodb --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval '
          try {
            const status = rs.status();
            if (status.ok !== 1) { quit(2); }
          } catch (error) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});
          }
        '
        until mongosh --host mongodb --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval 'db.hello().isWritablePrimary' | grep true; do sleep 2; done
    restart: "no"
    networks: [platform]
    logging: *default-logging

  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26.28-community}
    environment:
      NEO4J_AUTH: neo4j/${GRAPH_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_config_strict__validation_enabled: "false"
    # Host ports are overridable because Windows can make the defaults
    # unbindable. WinNAT/Hyper-V reserves TCP ranges dynamically, and on at
    # least one dev host it took 7454-7553 and 7679-7778 -- which contain both
    # of these -- after which Docker refuses the mapping with "An attempt was
    # made to access a socket in a way forbidden by its access permissions".
    # A container created before the reservation keeps working, so this surfaces
    # only on the next recreate, which makes it look unrelated to networking.
    #
    # `net stop winnat && net start winnat` from an elevated prompt releases the
    # ranges, but they can be taken again. Setting NEO4J_BOLT_PORT (and, if
    # needed, NEO4J_HTTP_PORT) in a local `.env` is the fix that needs no
    # elevation and survives a reboot. Defaults are unchanged, so no other
    # environment is affected. Host-run tests read the Bolt address from
    # PLATFORM_TEST_NEO4J_URI (tests/conftest.py); in-network consumers use
    # bolt://neo4j:7687 and are unaffected either way.
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${GRAPH_PASSWORD}' 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [platform]
    logging: *default-logging
    mem_limit: 2500m

  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-8.0.9-alpine}
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"${VALKEY_PASSWORD}\" ping 2>/dev/null | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [platform]
    logging: *default-logging
    mem_limit: 512m

  temporal-postgresql:
    image: postgres:${POSTGRES_VERSION:-17.10-alpine}
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_DB: temporal
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [platform]
    logging: *default-logging
    mem_limit: 1g

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.29.7}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: temporal-postgresql
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    ports:
      # 17233 on the host, not 7233. Windows reserves TCP 7147-7246 for
      # WinNAT/Hyper-V dynamic use, so a bind on 7233 fails with "an attempt
      # was made to access a socket in a way forbidden by its access
      # permissions" -- and a container that loses the bind on restart comes
      # back healthy with no published port at all, which reads as Temporal
      # being up while every host process cannot reach it.
      #
      # Every other service here already publishes on a 1xxxx port for this
      # reason: SQL Server 14330, Neo4j 17474/17687. Temporal was the outlier.
      # In-container addressing is unchanged and stays `temporal:7233`.
      - "127.0.0.1:${TEMPORAL_PORT:-17233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks: [platform]
    logging: *default-logging
    mem_limit: 1500m

  # --- dev-tools ------------------------------------------------------------
  # Started only with `--profile dev-tools`. Nothing in the default or
  # containerized-app profiles depends on any of these, so a deployment that
  # never passes the flag runs without them.
  temporal-ui:
    profiles: ["dev-tools"]
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.52.1}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${PLATFORM_FRONTEND_CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks: [platform]
    logging: *default-logging
    mem_limit: 512m

  # Bootstrap, not an application service: it seeds the graph configuration the
  # backend and every worker read at startup, so it belongs in the default
  # profile alongside the datastores rather than behind the app profile.
  # Not `--if-missing`, for the reason scripts/prepare_runtime_configuration.sh
  # gives at length: that flag returns as soon as any release is active, BEFORE
  # comparing what is on disk to what is published, so an edited configuration
  # could never reach a container that had published once. Without it an
  # unchanged configuration prints UNCHANGED and publishes nothing, and a
  # changed one publishes -- which is also what lets the per-stage Order Agent
  # task ids reach a container at all.
  runtime-configuration-init:
    <<: *backend-base
    command:
      - sh
      - -ec
      - >-
        python /app/scripts/apply_neo4j_migrations.py &&
        python /app/scripts/apply_sql_migrations.py &&
        if [ "$${PLATFORM_VALIDATE_AI_ON_STARTUP}" = "true" ]; then
          python /app/scripts/bootstrap_graph_configuration.py --validate-ai;
        else
          python /app/scripts/bootstrap_graph_configuration.py;
        fi
    depends_on:
      neo4j:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    restart: "no"

  # Test data. Phase 4b decoupled every application service from it, and the
  # plan's rule -- "application services never depend on seed-runner" -- is
  # still true: nothing declares it as a dependency.
  seed-runner:
    profiles: ["dev-tools"]
    <<: *backend-base
    command: ["python", "/app/scripts/seed_e2e_data.py"]
    depends_on:
      runtime-configuration-init:
        condition: service_completed_successfully
      mongodb-rs-init:
        condition: service_completed_successfully
      sqlserver-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["containerized-app"]
    <<: *backend-base
    command: ["uvicorn", "return_platform.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    # Overridable for the same reason as Neo4j's: WinNAT/Hyper-V reserves TCP
    # ranges dynamically and the set GROWS. On this dev host it reached
    # 7979-8078, which contains 8000, so `--profile containerized-app` failed to
    # start the API with "An attempt was made to access a socket in a way
    # forbidden by its access permissions". Set BACKEND_PORT in a local `.env`.
    # Only the host mapping moves -- the container listens on 8000, the
    # healthcheck probes 8000, and the frontend proxies to http://backend:8000.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      runtime-configuration-init:
        condition: service_completed_successfully
      mongodb-rs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  return-workflow-worker:
    profiles: ["containerized-app"]
    <<: *backend-base
    command: ["python", "/app/scripts/run_return_workflow_worker.py"]
    depends_on:
      runtime-configuration-init:
        condition: service_completed_successfully
      mongodb-rs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  order-discovery-worker:
    profiles: ["containerized-app"]
    <<: *backend-base
    command: ["python", "/app/scripts/run_order_discovery_worker.py"]
    depends_on:
      runtime-configuration-init:
        condition: service_completed_successfully
      mongodb-rs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  return-orchestrator:
    profiles: ["containerized-app"]
    <<: *backend-base
    command: ["python", "/app/scripts/run_return_orchestrator.py"]
    depends_on:
      runtime-configuration-init:
        condition: service_completed_successfully
      mongodb-rs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      return-workflow-worker:
        condition: service_started

  outbox-publisher:
    profiles: ["containerized-app"]
    <<: *backend-base
    command: ["python", "/app/scripts/run_outbox_publisher.py"]
    depends_on:
      runtime-configuration-init:
        condition: service_completed_successfully
      mongodb-rs-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  integration-outbox-worker:
    profiles: ["containerized-app"]
    <<: *backend-base
    command: ["python", "-m", "return_platform.workers.integration_outbox"]
    depends_on:
      runtime-configuration-init:
        condition: service_completed_successfully
      mongodb-rs-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  housekeeping-worker:
    profiles: ["containerized-app"]
    <<: *backend-base
    command: ["python", "/app/scripts/run_housekeeping_worker.py"]
    depends_on:
      runtime-configuration-init:
        condition: service_completed_successfully
      mongodb-rs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    profiles: ["containerized-app"]
    image: return-platform-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_BACKEND_TARGET: http://backend:8000
        VITE_DATA_SOURCE_CREDENTIAL_REVEAL_ENABLED: ${PLATFORM_DATA_SOURCE_CREDENTIAL_REVEAL_ENABLED:-false}
    ports:
      - "127.0.0.1:3200:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]
    logging: *default-logging
    mem_limit: 512m

  # The real-infra test runner, and a shell on the platform network for ad-hoc
  # diagnostics. `run_real_infra_suite.sh` targets this.
  #
  # It replaces a container that nothing in this repository created: a hand-made
  # `python:3.13-slim` named `c2-test-runner` that source was `docker cp`-ed
  # into. `docker cp` merges rather than replaces, so a file left behind by one
  # session produced a green run for code that was not in the tree. The bind
  # mount below cannot do that -- it *is* the tree.
  #
  # Read-only on purpose. A test that writes into the source tree is a test that
  # can pollute the next run, and `PYTHONDONTWRITEBYTECODE` in the image means
  # there is no legitimate writer left. `tmp_path` and `/tmp` are unaffected.
  #
  # Not `*backend-base`: that anchor's config paths point into `/app/config`,
  # which exists in the runtime image and not in this one. The suite's own
  # conftest resolves configuration relative to the working tree.
  diagnostics:
    profiles: ["dev-tools"]
    image: return-platform-backend-test:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    command: ["sleep", "infinity"]
    working_dir: /workspace_root/backend
    environment:
      # In-network addresses. The repo `.env` carries *host* published ports
      # (SQL Server on 14330, for one), which is what four suite errors were
      # for eight commits before anyone read them.
      PLATFORM_TEST_MONGO_HOST: mongodb
      PLATFORM_TEST_NEO4J_HOST: neo4j
      PLATFORM_TEST_SQLSERVER_HOST: sqlserver
      PLATFORM_SQLSERVER_PORT: 1433
      PLATFORM_TEST_TEMPORAL_TARGET: temporal:7233
      # Not defaulted anywhere on purpose: a wrong guess trips Neo4j's auth rate
      # limiter, which then fails every Neo4j test until the container restarts.
      GRAPH_PASSWORD: ${GRAPH_PASSWORD:?set GRAPH_PASSWORD in the repo .env}
      # `tests/conftest.py`'s `test_settings` fixture only reads these to
      # populate Settings fields; nothing under test makes a provider call. Real
      # credentials are not needed and must not be put here. To exercise a real
      # reasoning turn, use the MANUAL provider, which needs no key at all.
      NVIDIA_API_KEY: placeholder-not-a-real-key
      GOOGLE_API_KEY: placeholder-not-a-real-key
    volumes:
      - ./backend:/workspace_root/backend:ro
      # `tests/conftest.py::pytest_configure` hard-fails if the repository .env
      # is absent, so without this the suite could not start in this container
      # at all -- it aborted with an INTERNALERROR before collecting a test.
      # Mounting it does not reintroduce the host-port problem the environment
      # block above solves: `load_dotenv(override=False)` leaves an
      # already-exported variable alone, so these in-network addresses still win.
      - ./.env:/workspace_root/.env:ro
    networks: [platform]
    logging: *default-logging
    depends_on:
      mongodb-rs-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      valkey:
        condition: service_healthy

networks:
  platform:
    driver: bridge

volumes:
  sqlserver_data:
  neo4j_data:
  neo4j_logs:
  mongo_data:
  mongo_config:
  valkey_data:
  temporal_pg_data:
