<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Operational console for monitoring Return Platform infrastructure and data services."
    />
    <meta name="color-scheme" content="light" />

    <title>Return Platform Console</title>
  </head>

  <!-- Theme tokens, not Tailwind's default palette. These utilities sit above
       the `body` rule in index.css, so leaving them as slate here silently
       overrode the platform surface colour. -->
  <body
    class="bg-surface text-on-surface antialiased selection:bg-secondary-container"
  >
    <noscript>
      JavaScript is required to use the Return Platform Console.
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
