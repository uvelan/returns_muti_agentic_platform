name: secret-scan

# SEC-01. A credential reached this repository once and is still recoverable
# from history; `.gitignore` stops the next accident only if the next accident
# happens to be named `.env`. This workflow is the gate that does not depend on
# a filename.
#
# It does NOT replace GitHub's own push protection. Push protection rejects a
# known provider-key shape at `git push`, before a run ever starts, and must
# stay enabled on this repository (Settings -> Code security -> Secret
# protection -> Push protection). This workflow covers what push protection
# does not: infrastructure passwords, DSNs, private-key blocks, and anything
# whose shape GitHub does not ship a partner pattern for.

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets the repository owner re-run the history gate after the SEC-01 purge
  # without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Gate 0 -- prove the scanner still fails on a planted credential.
  #
  # Every other job in this file is a scanner that reported "clean". That
  # result is worth nothing unless the scanner can still fail, so this runs
  # first and blocks the rest: a green scan from a broken scanner is exactly
  # the false confidence SEC-01 was hiding behind.
  # ---------------------------------------------------------------------
  scanner-self-test:
    name: scanner self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Negative controls
        run: python scripts/security/test_scan_secrets.py

  # ---------------------------------------------------------------------
  # Gate 1 -- the pre-merge gate. Scans only what this push or pull request
  # actually introduces, so it is fast and its verdict is unambiguous: a
  # failure here means *this change* carries a credential.
  # ---------------------------------------------------------------------
  incoming-changes:
    name: incoming changes
    needs: scanner-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Both sides of the comparison must be present locally.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the range this event introduces
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # A new branch reports an all-zero "before"; there is no range to
            # diff against, so fall back to the default branch.
            if [ -z "${base//0/}" ]; then
              git fetch --no-tags origin "${{ github.event.repository.default_branch }}" || true
              base="$(git rev-parse FETCH_HEAD 2>/dev/null || echo '')"
            fi
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "range=" >> "$GITHUB_OUTPUT"
          else
            echo "range=${base}..${head}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan the introduced commits
        shell: bash
        run: |
          set -euo pipefail
          range="${{ steps.range.outputs.range }}"
          if [ -z "$range" ]; then
            echo "No resolvable base; scanning the working tree instead."
            python scripts/security/scan_secrets.py --mode worktree
          else
            echo "Scanning $range"
            # --no-allowlist: nothing arriving now gets to inherit the SEC-01
            # baseline. The baseline covers history, not new work.
            python scripts/security/scan_secrets.py --mode range --range "$range" --no-allowlist
          fi

  # ---------------------------------------------------------------------
  # Gate 2 -- the working tree. Catches a credential that was committed on an
  # earlier branch and merged in without ever appearing in this event's range.
  # ---------------------------------------------------------------------
  working-tree:
    name: working tree
    needs: scanner-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan tracked files
        run: python scripts/security/scan_secrets.py --mode worktree --no-allowlist

  # ---------------------------------------------------------------------
  # Gate 3 -- full history, measured against the reviewed SEC-01 baseline in
  # scripts/security/known_exposures.json.
  #
  # This job is EXPECTED TO PASS today and expected to keep passing after the
  # purge: it fails the moment history contains a credential that is not in the
  # baseline. Once the purge has run and the baseline array is emptied, it
  # becomes a plain "history is clean" assertion.
  #
  # gitleaks is the primary engine because it carries a far broader rule set
  # than anything maintained here; scan_secrets.py runs alongside it because it
  # is the tool that owns the baseline and the redaction contract.
  # ---------------------------------------------------------------------
  full-history:
    name: full history
    needs: scanner-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan every reachable blob against the SEC-01 baseline
        run: python scripts/security/scan_secrets.py --mode history

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.28.0"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks over full history
        shell: bash
        run: |
          set -euo pipefail
          # --redact keeps the value out of the log even on failure, which is
          # the whole point: a public Actions log must never become the second
          # place the credential leaked.
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --verbose

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
