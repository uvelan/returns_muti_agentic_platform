[project]
name = "return-platform-backend"
version = "0.1.0"
description = "Return Platform API and Data Console"
requires-python = ">=3.13,<3.14"

authors = [
    { name = "Platform Engineering" }
]

dependencies = [
    "fastapi==0.139.1",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.0",
    "pydantic-settings==2.14.2",
    "pymongo==4.17.0",
    "neo4j==6.2.0",
    "pymssql==2.3.13",
    # §5A requires a read-only PostgreSQL analyzer connector alongside MongoDB,
    # SQL Server and Neo4j, and no Postgres driver was declared at all -- the
    # connector could not be written, only planned. psycopg 3 over psycopg2 and
    # asyncpg because it is the one of the three that speaks the full catalogue
    # surface the connector reads without a second dialect layer.
    #
    # It is nonetheless driven *synchronously*, inside `asyncio.to_thread`, the
    # way `SqlServerSourceScanConnector` drives pymssql: psycopg 3's async
    # connection refuses to run on `ProactorEventLoop`, which is asyncio's
    # default on Windows and what uvicorn selects there, so `AsyncConnection`
    # works in the Linux containers and raises `InterfaceError` on every
    # developer machine here. Found by running it, not by reading the docs.
    #
    # `[binary]` because the pure-Python build wants libpq development headers
    # at install time, which those same machines do not have and the container
    # images would have to grow to supply.
    "psycopg[binary]==3.3.4",
    "redis==8.0.1",
    "temporalio==1.30.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "langgraph==1.2.10",
    "langgraph-checkpoint==4.2.0",
    "cryptography==50.0.0",
]

[tool.poetry]
package-mode = true

packages = [
    { include = "return_platform", from = "src" }
]

include = [
    { path = "src/return_platform/py.typed", format = ["sdist", "wheel"] },
    { path = "src/return_platform/data_platform/graph/migrations/*.cypher", format = ["sdist", "wheel"] },
    { path = "src/return_platform/configuration/sql_migrations/*.sql", format = ["sdist", "wheel"] }
]

# The dev toolchain. Poetry is the only packaging tool here: `poetry.lock`
# is the single lockfile, and the Dockerfile exports from it rather than
# re-resolving. A parallel `[dependency-groups]` table existed while a move
# to uv was in progress and was removed with it -- two dependency lists that
# a comment asks you to hand-sync will drift, and nothing was checking.
[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
ruff = "0.15.21"
mypy = "2.3.0"
types-pyyaml = "^6.0.12.20260518"
pytest-cov = ">=7.1,<8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "ASYNC",
    "RUF",
]
ignore = ["E501", "RUF100"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

# Four suites. `tests/conftest.py::pytest_collection_modifyitems` gives every
# collected test exactly one of these, so the four partition the tree rather
# than overlapping -- and `tests/platform/
# test_the_normal_suite_never_needs_live_infrastructure.py` fails if a module
# that opens a real driver connection is not in the `live_infra` one.
markers = [
    "unit: no infrastructure, no network, no in-process application composition.",
    "integration: composes the application in-process (app factory, TestClient, workflow test environment). Stubs permitted. Still opens no connection to a real service.",
    "live_infra: needs the real MongoDB / Neo4j / Temporal / SQL Server / Valkey. Deselected from the default run; `scripts/dev/run_real_infra_suite.sh` selects it.",
    "browser: drives a real browser. Deselected from the default run.",
]

addopts = [
    "--strict-config",
    "--strict-markers",
    # The default run is the *normal* suite: unit + integration.
    #
    # Not a convenience. Before this line the default run was every test in the
    # tree, so one live-infrastructure test that blocked took the whole suite
    # with it: the run aborted inside `test_order_agent_rest.py` and 2,700-odd
    # unrelated tests produced no result at all. A suite whose signal any one
    # datastore can destroy is a suite nobody can act on.
    #
    # Deselection, not skipping. These tests are mandatory and they run -- in
    # the suite that has what they need, where a failure means the thing under
    # test is broken rather than absent. `-m` on the command line replaces this
    # (it is a `store` option and the command line is parsed after addopts),
    # which is how the live and browser suites select themselves back in.
    "-m",
    "not live_infra and not browser",
]
