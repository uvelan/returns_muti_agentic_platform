module_id: agent.order_discovery
module_type: AGENT
schema_version: "1.0"
configuration_version: "2.0.0"
owner: ORDER_DISCOVERY
status: DRAFT
dependencies:
  - module_id: policy.clarification
    version_constraint: "^2.0"
  - module_id: policy.candidate_scoring
    version_constraint: "^2.0"
  - module_id: sync.order_partial
    version_constraint: "^1.0"
  - module_id: sync.order_full
    version_constraint: "^1.0"
payload:
  name: Order Discovery Agent
  enabled: true
  execution_mode: HUMAN_APPROVAL_REQUIRED
  ai_assisted: true
  input_contexts: [ReturnSessionContext, DiscoveryInputContext]
  output_context: DiscoveryContext
  capabilities:
    - normalize_evidence
    - classify_order_source
    - rank_candidates
    - explain_candidate_evidence
    - recommend_dynamic_clarification
  direct_agent_calls_allowed: false
  idempotency_required: true

