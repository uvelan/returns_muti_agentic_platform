module_id: agent.graph_schema_design
module_type: AGENT
schema_version: "1.0"
configuration_version: "2.0.0"
owner: DATA_PLATFORM_GOVERNANCE
status: DRAFT
dependencies:
  - module_id: policy.privacy
    version_constraint: "^2.0"
payload:
  name: Graph Schema Design Agent
  enabled: true
  execution_mode: HUMAN_APPROVAL_REQUIRED
  ai_assisted: true
  input_contexts: [SchemaDesignContext]
  output_context: SchemaProposalContext
  capabilities:
    - inspect_source_metadata
    - identify_configuration_gaps
    - ask_focused_configuration_question
    - generate_schema_proposal
    - explain_schema_diff
    - run_sandbox_validation
  forbidden_capabilities:
    - approve_configuration
    - activate_configuration
    - run_migration
    - run_backfill
    - run_production_sync
  direct_agent_calls_allowed: false
  idempotency_required: true

