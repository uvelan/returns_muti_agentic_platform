# Volumes and knobs for `scripts/generate_seed_data.py`.
#
# Everything the generator varies lives here, so changing the size of the
# corpus never means editing code.

# Fixed so two runs produce the same corpus. Change it to get a different one;
# a run is reproducible from this number alone.
#
# Every identifier, SKU, description, name, email and address is a function of
# this number. The one exception is the source-change timestamp on the product
# master and the CDM party -- neither has a business date to derive from, so
# both are stamped at run time. See `_run` in the generator.
seed: 20260812

# Totals, not additions. Each count is the size of the finished collection,
# real documents included: `products: 1000` with 483 real catalogue numbers
# generates 517. The generator never drops a real document, so a count below
# the number of real ones is refused rather than silently satisfied.
#
# `warehouses` is gone: warehouse documents are now minted per distinct
# inventory warehouse id actually used by the generated orders, so the number
# is an outcome of the corpus rather than a free choice. Nothing reads that
# collection -- see the note in the generator's docstring.
counts:
  customers: 1000
  products: 1000
  orders: 10000

# Lines per order is no longer a range. `seed_ferguson_idiom.LINES_PER_ORDER`
# is the real empirical multiset from the 101 real orders -- 29 of them carry a
# single line and one carries 49 -- because drawing uniformly from a range makes
# single-line orders, the commonest return case, rare.

# How many of an order's lines carry a shipment. The rest are still open, which
# is the state most returns are raised against.
shipped_fraction: 0.7

order_dates:
  # Inclusive ISO dates. Orders are spread uniformly across the window, which
  # keeps date-window searches meaningful at every point in it.
  earliest: "2025-01-01"
  latest: "2026-08-01"

# Emails are derived from the generated name, so the domain pool is the only
# free choice. Deliberately obvious throwaway domains: this corpus must never
# be mistaken for real customer data.
email_domains:
  - example.com
  - example.net
  - mail.example.org

# Written to `return_source`. Names match what the active schema's source
# assets declare in `object_ref.name`; changing one here without changing the
# schema produces a collection nothing reads.
collections:
  orders: salesInv
  customers: customerOutboundCDM
  products: lkpSearchProduct
  shipments: shipmentInfo
  # Provisional -- see the note in the generator's docstring and in
  # docs/SEED_DATA_GENERATION.md. No warehouse source exists in the schema yet.
  warehouses: warehouseMaster

# `replace` is gone. It was a choice between dropping the collection and
# appending to it, and both are wrong now that real Ferguson documents share
# these collections: dropping destroys them and appending doubles the corpus on
# the second run. The generator instead deletes exactly what is not in
# `backend/fixtures/real_ferguson_source/` and reinserts, which is idempotent
# and cannot touch a real document.
