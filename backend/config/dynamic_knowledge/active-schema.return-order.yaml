graph:
  database: neo4j
  nodes:
    customer_node:
      projection_id: customer_node
      entity_id: customer
      label: Customer
      key_fields:
      - account_id
      - customer_id
      property_fields:
      - customer_name
      - source_updated_at
    contact_point_node:
      projection_id: contact_point_node
      entity_id: contact_point
      label: ContactPoint
      key_fields:
      - account_id
      - customer_id
      - contact_value
      property_fields:
      - customer_name
      - contact_first_name
      - contact_last_name
      - email
      - phone_number
      - address_line1
      - city
      - state
      - postal_code
      - county
      - source_updated_at
    sales_order_node:
      projection_id: sales_order_node
      entity_id: sales_order
      label: SalesOrder
      key_fields:
      - account_id
      - sales_order_number
      property_fields:
      - order_key
      - customer_id
      - customer_name
      - customer_po_number
      - job_name
      - order_status
      - sales_type
      - source_system_code
      - sell_warehouse_id
      - ship_from_warehouse_id
      - shipping_method
      # The three that decide whether the order was delivered. Declaring the
      # fields is not enough: a field absent from this list is read by the
      # schema and written nowhere, so the agent's own query would return null
      # for every order and "was it delivered" would answer no, always.
      - ship_via_code
      - fleetwise_status
      - delivery_signature_at
      - order_date
      - invoice_date
      - shipped_at
      - commit_date
      - ship_to_name
      - ship_to_phone
      - ship_to_city
      - ship_to_state
      - ship_to_postal_code
      - source_updated_at
    order_line_node:
      projection_id: order_line_node
      entity_id: order_line
      label: OrderLine
      key_fields:
      - account_id
      - sales_order_number
      - line_number
      property_fields:
      - line_type
      - product_id
      - master_product_id
      - sku
      - product_description
      - ordered_quantity
      - shipped_quantity
      - backorder_quantity
      - net_price
      - line_net_amount
      - inventory_warehouse_id
      - source_updated_at
    product_node:
      projection_id: product_node
      entity_id: product
      label: Product
      key_fields:
      - product_id
      property_fields:
      - master_product_vendor_id
      - sku
      - upc_code
      - base_model_number
      - product_description
      - product_long_description
      - web_display_name
      - vendor_name
      - brand_type
      - unit_of_measure
      - unit_of_measure_description
      - department_description
      - source_updated_at
    customer_account_node:
      projection_id: customer_account_node
      entity_id: customer_account
      label: CustomerAccount
      key_fields:
      - party_id
      - customer_id
      property_fields:
      - customer_account
      - customer_branch_id
      - customer_name
      - source_updated_at
    customer_party_node:
      projection_id: customer_party_node
      entity_id: customer_party
      label: CustomerParty
      key_fields:
      - party_id
      property_fields:
      - party_name
      - organization_name
      - b2b_customer
      - source_updated_at
    shipment_node:
      projection_id: shipment_node
      entity_id: shipment
      label: Shipment
      key_fields:
      - tracking_number
      property_fields:
      - sales_order_number
      - shipment_id
      - account_id
      - current_status
      - source_system
      - source_updated_at
    return_case_node:
      projection_id: return_case_node
      entity_id: return_case
      label: ReturnCase
      key_fields:
      - case_id
      property_fields:
      - tenant_id
      - principal_id
      - branch_id
      - case_status
      - conversation_id
      - support_work_item_id
      - confirmed_order_reference
      - session_id
      - workflow_id
      - created_at
      - source_updated_at
    return_record_node:
