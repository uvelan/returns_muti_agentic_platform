  return_item:
    entity_id: return_item
    description: 'One line being sent back, from `operational_return_items`. That collection carries two
      shapes written by two flows -- a case-scoped item (caseId/returnRecordId/quantity/reason) and the
      older session-scoped intake item (sessionId/productId/requestedQuantity/reasonCode) -- so both are
      mapped and each field says which writer fills it. They are deliberately not coalesced into one
      quantity or one reason: a session item''s requestedQuantity is what was asked for and a case item''s
      quantity is what was declared, and folding them together would assert an equivalence the data does
      not have.'
