          operators:
          - EXACT
          - EQUALS
          aggregations: []
        permissions:
          displayable_by:
          - '*'
          masking: null
      customer_name:
        field_id: customer_name
        description: 'Customer name as the bridge record states it. Replaces the former ship_to_phone
          field, which was removed rather than repointed: the real bridge record carries no phone of
          any kind, and the owning party''s additionalMcustomerInfo.mcustPhone is the master
          customer''s number, not a delivery contact -- keeping the field name over that value would
