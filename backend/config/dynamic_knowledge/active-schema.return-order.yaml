  relationships:
    customer_placed_order:
      relationship_id: customer_placed_order
      relationship_type: PLACED_ORDER
      source_entity_id: customer
      target_entity_id: sales_order
      source_match_fields:
      - account_id
      - customer_id
      target_match_fields:
      - account_id
      - customer_id
      property_fields: []
      access: CONNECTED_SYNC
    customer_has_contact_point:
      relationship_id: customer_has_contact_point
      relationship_type: HAS_CONTACT
      source_entity_id: customer
      target_entity_id: contact_point
      source_match_fields:
      - account_id
      - customer_id
      target_match_fields:
      - account_id
      - customer_id
      property_fields: []
      access: CONNECTED_SYNC
    order_has_line:
      relationship_id: order_has_line
      relationship_type: HAS_ORDER_LINE
      source_entity_id: sales_order
      target_entity_id: order_line
      source_match_fields:
      - account_id
      - sales_order_number
      target_match_fields:
      - account_id
      - sales_order_number
      property_fields: []
      access: CONNECTED_SYNC
    line_references_product:
      relationship_id: line_references_product
      relationship_type: REFERENCES_PRODUCT
      source_entity_id: order_line
      target_entity_id: product
      source_match_fields:
      - master_product_id
      target_match_fields:
      - product_id
      property_fields: []
      access: CONNECTED_SYNC
    party_has_account:
      relationship_id: party_has_account
      relationship_type: HAS_ACCOUNT
      source_entity_id: customer_party
      target_entity_id: customer_account
      source_match_fields:
      - party_id
      target_match_fields:
      - party_id
      property_fields: []
      access: SEED_ONLY
    order_shipped_as:
      relationship_id: order_shipped_as
      relationship_type: SHIPPED_AS
      source_entity_id: sales_order
      target_entity_id: shipment
      source_match_fields:
      - sales_order_number
      target_match_fields:
      - sales_order_number
      property_fields: []
      # SEED_ONLY only ever because `shipment` was: the endpoint ceiling forbade
      # anything higher. Now that both endpoints sync, leaving it would declare
      # that this edge is seed-only when a connected sync does in fact form it.
      access: CONNECTED_SYNC
    case_covers_order:
      relationship_id: case_covers_order
      relationship_type: COVERS_ORDER
      source_entity_id: return_case
      target_entity_id: sales_order
      source_match_fields:
      - confirmed_order_reference
      target_match_fields:
      - sales_order_number
      property_fields: []
      access: CONNECTED_SYNC
      # The edge that makes "has this customer returned this before" answerable:
      # Customer -PLACED_ORDER-> SalesOrder <-COVERS_ORDER- ReturnCase.
      #
      # MANY_TO_MANY with no bound, deliberately. An order number is unique
      # within an account and not globally (see sales_order.sales_order_number),
      # and the confirmation only carries the number, so one case legitimately
      # matches the same number in two branches. Declaring ONE_TO_ONE here would
      # abort the whole Stage B reconciliation the first time that happened.
      cardinality: MANY_TO_MANY
    case_raised_return_record:
      relationship_id: case_raised_return_record
      relationship_type: RAISED_RETURN_RECORD
      source_entity_id: return_case
      target_entity_id: return_record
      source_match_fields:
      - case_id
      target_match_fields:
      - case_id
      property_fields: []
      access: CONNECTED_SYNC
      # One case, N RMAs -- decision D6. Bounded on the target side only: a
      # record document carries exactly one caseId, so more than one owning case
      # would mean two case nodes sharing a case_id, which the key forbids.
      cardinality: ONE_TO_MANY
      maximum_sources_per_target: 1
    case_includes_return_item:
      relationship_id: case_includes_return_item
      relationship_type: INCLUDES_RETURN_ITEM
      source_entity_id: return_case
      target_entity_id: return_item
      source_match_fields:
      - case_id
      target_match_fields:
      - case_id
      property_fields: []
      access: CONNECTED_SYNC
      # Separate from the RMA edge because items exist before any RMA does: the
      # associate names the lines, and only later does Support say which record
      # covers which. Without this edge a case's items are unreachable in that
      # window.
      cardinality: ONE_TO_MANY
      maximum_sources_per_target: 1
    return_record_covers_item:
      relationship_id: return_record_covers_item
      relationship_type: COVERS_RETURN_ITEM
      source_entity_id: return_record
      target_entity_id: return_item
      source_match_fields:
      - return_record_id
      target_match_fields:
      - return_record_id
      property_fields: []
      access: CONNECTED_SYNC
      # "What else is on this RMA". One RMA covers N items and an item belongs to
      # at most one RMA, which is why the return record is first-class rather
      # than a return reference stamped on each item.
      cardinality: ONE_TO_MANY
      maximum_sources_per_target: 1
    case_staged_as:
      relationship_id: case_staged_as
      relationship_type: STAGED_AS
      source_entity_id: return_case
      target_entity_id: return_handling_unit
      source_match_fields:
      - session_id
      target_match_fields:
      - session_id
      property_fields: []
      access: CONNECTED_SYNC
      # Unbounded on both sides even though the intent is one session per case:
      # `cases.sessionId` is indexed but NOT uniquely, so two cases sharing a
      # session is a state the store permits, and a cardinality bound would turn
      # it into a failed sync rather than a visible oddity in the graph.
      cardinality: MANY_TO_MANY
    warehouse_HAS_BAY_bay:
      relationship_id: warehouse_HAS_BAY_bay
      relationship_type: HAS_BAY
      source_entity_id: warehouse
      target_entity_id: bay
      source_match_fields:
      - warehouse_id
      target_match_fields:
      - warehouse_id
      property_fields: []
      access: CONNECTED_SYNC
      cardinality: ONE_TO_MANY
      maximum_targets_per_source: null
      maximum_sources_per_target: 1
agent_policies:
  order-discovery-agent:
    agent_id: order-discovery-agent
    task_queue: order-discovery
    allowed_business_capabilities:
    - entity-resolution
    - order-discovery
    - product-discovery
    - purchase-history
    - candidate-disambiguation
    - return-context-collection
    allowed_roles:
    - '*'
    allowed_entity_ids:
    - customer
    - contact_point
    - sales_order
    - order_line
    - product
    - shipment
    - bay
    - warehouse
    # The return side. Projecting these into the graph is not enough on its own:
    # SchemaQueryGuard refuses any plan whose start or traversal entity is not
    # named here, and Neo4jKnowledgeGateway.compact_schema builds the entity and
    # relationship catalogue the model sees from this same list -- so an omission
    # reads as "the agent cannot see returns" rather than as a policy setting.
    - return_case
    - return_record
    - return_item
    - return_handling_unit
    standard_model_refs:
    - ai-task://ORDER_AGENT_REASONING_V1
    max_reasoning_steps: 32
    max_graph_queries_per_turn: 12
    max_correction_attempts: 2
    max_clarifications: 10
    max_replans: 2
    max_targeted_syncs_per_turn: 3
