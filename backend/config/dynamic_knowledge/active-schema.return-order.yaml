  # The four sources below are the platform's OWN operational store, not an
  # upstream system: object_ref.database is return_platform (Settings.mongo_database)
  # rather than return_source, and GraphSyncService routes them to a connector
  # bound to that database. Declaring the database is therefore load-bearing here
  # and not documentation -- a Mongo source that names any other database is read
  # from the upstream store, which for these collections would silently find
  # nothing.
  #
  # Every one of them cursors on updatedAt rather than on _id. Two of these
  # collections are written with a string uuid _id (see
  # OperationalRepository.persist_return_intake_records), so ObjectId cursoring --
  # what a source with no incremental_cursor_field falls back to -- would compare
  # a string against an ObjectId and page through them in BSON type order rather
  # than in write order.
  source_return_cases:
    source_asset_id: source_return_cases
    connector_type: MONGODB
    object_ref:
      database: return_platform
      name: cases
    incremental_cursor_field: source_updated_at
  source_return_records:
    source_asset_id: source_return_records
    connector_type: MONGODB
    object_ref:
      database: return_platform
      name: return_records
    incremental_cursor_field: source_updated_at
  source_return_items:
    source_asset_id: source_return_items
    connector_type: MONGODB
    object_ref:
      database: return_platform
      name: operational_return_items
    incremental_cursor_field: source_updated_at
  source_handling_units:
    source_asset_id: source_handling_units
    connector_type: MONGODB
    object_ref:
      database: return_platform
      name: handling_units
    incremental_cursor_field: source_updated_at
  source_bays:
    source_asset_id: source_bays
    connector_type: MSSQL
    object_ref:
      namespace: platform
      name: bay_configuration
    incremental_cursor_field: updated_at
