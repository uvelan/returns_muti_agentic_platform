        minimum_fields_present: 1
        maximum_expected_matches: 1
        on_demand_sync_allowed: true
      exact_order_in_account:
        anchor_id: exact_order_in_account
        fields:
        - field_id: account_id
          allowed_operators:
          - EXACT
          - EQUALS
          required: true
        - field_id: sales_order_number
          allowed_operators:
          - EXACT
          - EQUALS
          required: true
        minimum_fields_present: 2
        maximum_expected_matches: 1
