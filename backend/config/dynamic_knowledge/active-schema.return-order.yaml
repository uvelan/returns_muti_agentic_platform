      property_fields:
      - party_name
      - organization_name
      - b2b_customer
      - source_updated_at
    shipment_node:
      projection_id: shipment_node
      entity_id: shipment
      label: Shipment
      key_fields:
      - tracking_number
      property_fields:
      - sales_order_number
      - carrier_code
      - shipment_id
      - account_id
      - current_status
      - source_system
      - shipped_at
      - source_updated_at
  relationships:
    customer_placed_order:
      relationship_id: customer_placed_order
      relationship_type: PLACED_ORDER
      source_entity_id: customer
      target_entity_id: sales_order
      source_match_fields:
      - account_id
      - customer_id
      target_match_fields:
      - account_id
      - customer_id
      property_fields: []
      access: CONNECTED_SYNC
    customer_has_contact_point:
