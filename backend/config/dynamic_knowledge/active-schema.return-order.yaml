        fields:
        - field_id: sales_order_number
          allowed_operators:
          - EXACT
          - EQUALS
          required: true
        minimum_fields_present: 1
        maximum_expected_matches: 25
        on_demand_sync_allowed: true
      probable_order_by_customer_and_status:
        anchor_id: probable_order_by_customer_and_status
        # Combination anchor for associates who cannot supply an order number:
        # two weaker signals together (customer id and order status) are
        # treated as identifying enough to trigger a targeted sync. Either
        # field alone is not sufficient (minimum_fields_present: 2).
        fields:
        - field_id: customer_id
          allowed_operators:
          - EQUALS
          required: false
        - field_id: order_status
          allowed_operators:
          - EQUALS
          required: false
        minimum_fields_present: 2
        maximum_expected_matches: 25
        on_demand_sync_allowed: true
      exact_customer_po:
