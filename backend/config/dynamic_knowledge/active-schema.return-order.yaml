  customer_account:
    entity_id: customer_account
    description: 'The bridge between customerOutboundCDM and salesInv, read from the paths the real
      documents actually carry: party[].partyMainCusts[].mainCusts holds "BRANCH*CUSTID" (e.g.
      "PLYMOUTH*232385"), whose CUSTID half is what the order writers copy into salesInv
      custId/orderCust. Previously declared as party[].custAccts[].additionalCustomerInfo[], taken from
      the field specification rather than from data -- no real CDM document has a custAccts array at
      any level, so that path extracted nothing. It appeared to work only because the seed generator
      builds custAccts from whatever this entity declares, manufacturing the exact shape the
      declaration asserted and the source lacks. Verified against MASTER:900781, the one non-synthetic
      document in the extract.'
    source_asset_id: source_customers
    fields:
      party_id:
        field_id: party_id
        description: Owning master party id.
        physical_path:
        - partyId
        graph_property: party_id
