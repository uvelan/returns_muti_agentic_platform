entities:
  customer:
    entity_id: customer
    description: 'One customer per (branch account, ERP customer id). Sourced from salesInv rather than
      customerOutboundCDM: the order carries custId/custName directly, so this joins to sales_order without
      the unverified CDM party bridge.'
    source_asset_id: source_sales
    fields:
      account_id:
        field_id: account_id
        description: Branch account owning the order (e.g. CHARLOTTE).
        physical_path:
        - salesHdrEventData
