  shipment:
    entity_id: shipment
    description: 'Shipment context, verified against 100 genuine shipmentInfo documents. Every path
      below resolved on every document; three declared paths did not resolve on any and are gone rather
      than left projecting null forever. `carrierCode` and `shippedAt` are absent from shipmentInfoEventData
      entirely -- it holds exactly acctId, currentStatus, shipmentId, srcSystem, trilOrdNum and trkNum
      -- and `updatedAt` does not exist at the document root; the change timestamp is shipmentInfoEventMeta.lastUpdateTs,
      the same meta-block pattern salesInv cursors on. Carrier and ship date do exist in the source,
      but only inside the shipmentInfo[] detail array, at a different grain and in two mutually exclusive
      shapes: the Convey family carries carrierScac/carrierName (28 of 100 documents), the DispatchTrack
      family carries a truck and a driver instead of a carrier because it is own-fleet delivery. Reaching
      them would mean exploding shipmentInfo[], which makes a shipment''s presence in the graph conditional
      on that array being non-empty -- and an absent shipment is reported as AWAITING_HANDOFF, which is
      the false negative W2.6 exists to remove. Explode would also have to pick one array element per
      tracking number, and on one of the 100 documents element 0 is the one with no carrier while its
      three siblings name UPS. No `where` selector, deliberately: shipmentInfoEventMeta.docType is disptrck
      on 72 and convey on 28, both genuine shipments sharing one shipmentInfoEventData shape, so a selector
      would discard one whole family. Two documents carry docType disptrck over a convey-shaped body,
      which is a second reason not to route on it. Known and not fixed here: trkNum is not unique -- 93
      distinct values over 100 documents, with distinct shipments on distinct orders sharing a number
      -- so natural_key [tracking_number] merges them. Only _id (acctId*orderNumber*trkNum) is unique;
      changing the node key is a graph migration, not a W2.6 edit.'
    source_asset_id: source_shipments
    fields:
      tracking_number:
        field_id: tracking_number
