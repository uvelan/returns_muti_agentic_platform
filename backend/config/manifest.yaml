schema_version: "2.0"
release_id: returns-platform-v2-baseline
# CFG-5b: `configuration/application/loader.py` (`ConfigurationLoader`) was
# deleted -- the agent modules below were its last consumer, and nothing else
# in `backend/src` or `backend/tests` ever instantiated it (CFG-5's own
# research, `.plan/tracks/CFG.ledger.md`, step:05). This file is therefore
# read by nothing any more: `platform.system_store` below was ALREADY not
# loaded through this manifest before CFG-5b -- `platform/system_store/
# manifest_loader.py::load_system_store_config` reads
# `Settings.system_store_manifest_path` (`backend/config/platform/
# system_store.yaml`) directly, never this file (see `configuration/
# README.md`, "Precedence"). Kept as a historical index of that one entry
# rather than deleted outright, since deleting it decides nothing about
# `platform/system_store/manifest_loader.py` itself, which is outside this
# lease's Owns.
status: ACTIVE
modules:
  platform.system_store:
    path: platform/system_store.yaml
