graph:
  nodes:
  - label: Customer
    key_property: customer_key
    source_assets:
    - source.mongodb.customer_outbound_cdm
    - source.mongodb.sales_inv
    properties:
    - customer_key
    - party_id
    - customer_id
    - customer_name
    - phone_hash
    - email_hash
    - source_system
    - source_record_id
    - source_updated_at
    - graph_synced_at
    - sync_run_id
  - label: CustomerAccount
    key_property: account_key
    source_assets:
    - source.mongodb.customer_outbound_cdm
    properties:
    - account_key
    - customer_key
    - account_number
    - customer_id
    - source_updated_at
    - graph_synced_at
    - sync_run_id
  - label: SalesOrder
    key_property: sales_order_number
    source_assets:
    - source.mongodb.sales_inv
    properties:
    - sales_order_number
    - customer_id
    - source_system
    - order_status
    - sell_warehouse_id
    - ship_from_warehouse_id
    - shipping_method
    - delivered_at
    - source_updated_at
    - graph_synced_at
    - sync_run_id
  - label: OrderLine
    key_property: order_line_key
    source_assets:
    - source.mongodb.sales_inv
    properties:
    - order_line_key
    - sales_order_number
    - product_id
    - master_product_id
    - product_description
    - ordered_quantity
    - shipped_quantity
    - product_type
    - source_updated_at
    - graph_synced_at
    - sync_run_id
  - label: Product
    key_property: product_id
    source_assets:
    - source.mongodb.sales_inv
    - source.mongodb.product_search
    properties:
    - product_id
    - sku
    - master_product_id
    - product_description
    - product_type
    - source_updated_at
    - graph_synced_at
    - sync_run_id
  - label: Warehouse
    key_property: warehouse_id
    source_assets:
    - source.mongodb.sales_inv
    - platform.sql.bay_configuration
    properties:
    - warehouse_id
    - branch_id
    - source_updated_at
    - graph_synced_at
    - sync_run_id
  - label: Shipment
    key_property: tracking_number
    source_assets:
    - source.mongodb.shipment_info
    properties:
    - tracking_number
    - sales_order_number
    - carrier_code
    - shipped_at
    - source_updated_at
    - graph_synced_at
    - sync_run_id
  - label: Return
    key_property: return_reference
    source_assets:
    - source.sql.return_requests
    properties:
    - return_reference
    - session_id
    - sales_order_number
    - customer_reference
    - return_status
    - eligibility_decision
    - source_updated_at
    - graph_synced_at
    - sync_run_id
  - label: ReturnItem
    key_property: return_item_id
    source_assets:
    - source.sql.return_items
    properties:
    - return_item_id
    - return_reference
    - order_line_id
    - product_id
    - quantity
    - reason_code
    - item_status
    - source_updated_at
    - graph_synced_at
    - sync_run_id
  - label: ReturnTracking
    key_property: tracking_id
    source_assets:
    - source.sql.return_tracking
    properties:
    - tracking_id
    - return_reference
    - tracking_type
    - tracking_reference
    - carrier_code
    - tracking_status
    - event_at
    - graph_synced_at
    - sync_run_id
  - label: Bay
    key_property: bay_id
    source_assets:
    - platform.sql.bay_configuration
    properties:
    - bay_id
    - bay_name
    - warehouse_id
    - branch_id
    - bay_type
    - active
    - priority
    - max_package_count
    - overflow_bay_id
    - graph_synced_at
    - sync_run_id
  - label: BayAssignment
    key_property: assignment_id
    source_assets:
    - platform.sql.bay_assignment
    properties:
    - assignment_id
    - return_reference
    - order_line_id
    - item_number
    - package_count
    - warehouse_id
    - bay_id
    - status
    - confirmed_by_associate_id
    - graph_synced_at
    - sync_run_id
  - label: SupportTicket
    key_property: ticket_id
    source_assets:
    - platform.sql.return_support_ticket
    properties:
    - ticket_id
    - session_id
    - status
    - external_reference
    - return_reference
    - updated_at
    - graph_synced_at
    - sync_run_id
  relationships:
  - type: HAS_ACCOUNT
    from_label: Customer
    to_label: CustomerAccount
    from_key: customer_key
    to_key: account_key
  - type: PLACED_ORDER
    from_label: Customer
    to_label: SalesOrder
    from_key: customer_key
    to_key: sales_order_number
  - type: HAS_ORDER_LINE
    from_label: SalesOrder
    to_label: OrderLine
    from_key: sales_order_number
    to_key: order_line_key
  - type: REFERENCES_PRODUCT
    from_label: OrderLine
    to_label: Product
    from_key: order_line_key
    to_key: product_id
  - type: SOLD_BY_WAREHOUSE
    from_label: SalesOrder
    to_label: Warehouse
    from_key: sales_order_number
    to_key: warehouse_id
  - type: SHIPPED_FROM_WAREHOUSE
    from_label: SalesOrder
    to_label: Warehouse
    from_key: sales_order_number
    to_key: warehouse_id
  - type: HAS_ORIGINAL_SHIPMENT
    from_label: SalesOrder
    to_label: Shipment
    from_key: sales_order_number
    to_key: tracking_number
  - type: HAS_RETURN
    from_label: SalesOrder
    to_label: Return
    from_key: sales_order_number
    to_key: return_reference
  - type: HAS_RETURN_ITEM
    from_label: Return
    to_label: ReturnItem
    from_key: return_reference
    to_key: return_item_id
  - type: RETURN_ITEM_FOR_LINE
    from_label: ReturnItem
    to_label: OrderLine
    from_key: return_item_id
    to_key: order_line_key
  - type: HAS_TRACKING
    from_label: Return
    to_label: ReturnTracking
    from_key: return_reference
    to_key: tracking_id
  - type: ASSIGNED_TO_BAY
    from_label: ReturnItem
    to_label: Bay
    from_key: return_item_id
    to_key: bay_id
  - type: BINDS_RETURN_ITEM
    from_label: BayAssignment
    to_label: ReturnItem
    from_key: assignment_id
    to_key: return_item_id
  - type: USES_BAY
    from_label: BayAssignment
    to_label: Bay
    from_key: assignment_id
    to_key: bay_id
  - type: LOCATED_IN_WAREHOUSE
    from_label: Bay
    to_label: Warehouse
    from_key: bay_id
    to_key: warehouse_id
  - type: TRACKED_BY_SUPPORT_TICKET
    from_label: Return
    to_label: SupportTicket
    from_key: return_reference
    to_key: ticket_id
