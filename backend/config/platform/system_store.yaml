module_id: platform.system_store
module_type: PLATFORM
schema_version: "1.0"
configuration_version: "2.0.0"
owner: PLATFORM_ENGINEERING
status: DRAFT
dependencies: []
payload:
  provider: MONGODB
  allowed_providers:
    - NEO4J
    - MONGODB
    - POSTGRESQL
    - SQLSERVER
  auto_bootstrap_missing_structures: true
  migration_mode: FORWARD_ONLY
  fail_closed_on_drift: true
  migration_lock_required: true
  structures:
    conversations:
      physical_name: platform_conversations
      schema_version: 1
      indexes:
        - name: conversation_id_unique
          fields: [conversation_id]
          unique: true
    ai_traces:
      physical_name: platform_ai_traces
      schema_version: 1
    ai_interceptions:
      physical_name: platform_ai_interceptions
      schema_version: 1
    graph_schema_drafts:
      physical_name: platform_graph_schema_drafts
      schema_version: 1
    graph_generations:
      physical_name: platform_graph_generations
      schema_version: 1
    audit:
      physical_name: platform_audit
      schema_version: 1
    reasoning_checkpoints:
      physical_name: platform_reasoning_checkpoints
      schema_version: 1
      encrypted: true
      indexes:
        - name: thread_checkpoint_unique
          fields: [thread_id, checkpoint_ns, checkpoint_id]
          unique: true
    reasoning_checkpoint_writes:
      physical_name: platform_reasoning_checkpoint_writes
      schema_version: 1
      encrypted: true
      indexes:
        - name: thread_checkpoint_task_unique
          fields: [thread_id, checkpoint_ns, checkpoint_id, task_id, write_idx]
          unique: true
    reasoning_runs:
      physical_name: platform_reasoning_runs
      schema_version: 1
      indexes:
        - name: run_id_unique
          fields: [run_id]
          unique: true
        - name: expires_at_ttl
          fields: [expires_at]
          expire_after_seconds: 0
    reasoning_action_receipts:
      physical_name: platform_reasoning_action_receipts
      schema_version: 1
      indexes:
        - name: action_receipt_unique
          fields: [run_id, node_name, logical_action_id]
          unique: true
        - name: expires_at_ttl
          fields: [expires_at]
          expire_after_seconds: 0
    reasoning_resume_commands:
      physical_name: platform_reasoning_resume_commands
      schema_version: 1
      indexes:
        - name: command_id_unique
          fields: [command_id]
          unique: true
