module_id: platform.system_store
module_type: PLATFORM
schema_version: "1.0"
configuration_version: "2.0.0"
owner: PLATFORM_ENGINEERING
status: DRAFT
dependencies: []
payload:
  provider: MONGODB
  allowed_providers:
    - NEO4J
    - MONGODB
    - POSTGRESQL
    - SQLSERVER
  auto_bootstrap_missing_structures: true
  migration_mode: FORWARD_ONLY
  fail_closed_on_drift: true
  migration_lock_required: true
  structures:
    conversations:
      physical_name: platform_conversations
      schema_version: 1
      indexes:
        - name: conversation_id_unique
          fields: [conversation_id]
          unique: true
    ai_traces:
      physical_name: platform_ai_traces
      schema_version: 1
    ai_interceptions:
      physical_name: platform_ai_interceptions
      schema_version: 1
      # A held request is the full prompt a provider would have received, which
      # for the schema analyzer includes block 5 UNTRUSTED SOURCE SAMPLE -- rows
      # read out of a customer's database -- and, once answered, the human's
      # reply to it. Sealed at rest for the same reason source_samples is.
      encrypted: true
      indexes:
        - name: interception_id_unique
          fields: [interception_id]
          unique: true
        - name: pending_by_task
          fields: [status, task_id]
    graph_schema_drafts:
      physical_name: platform_graph_schema_drafts
      schema_version: 1
    graph_generations:
      physical_name: platform_graph_generations
      schema_version: 1
    audit:
      physical_name: platform_audit
      schema_version: 1
    reasoning_checkpoints:
      physical_name: platform_reasoning_checkpoints
      schema_version: 1
      encrypted: true
      indexes:
        - name: thread_checkpoint_unique
          fields: [thread_id, checkpoint_ns, checkpoint_id]
          unique: true
    reasoning_checkpoint_writes:
      physical_name: platform_reasoning_checkpoint_writes
      schema_version: 1
      encrypted: true
      indexes:
        - name: thread_checkpoint_task_unique
          fields: [thread_id, checkpoint_ns, checkpoint_id, task_id, write_idx]
          unique: true
    reasoning_runs:
      physical_name: platform_reasoning_runs
      schema_version: 1
      indexes:
        - name: run_id_unique
          fields: [run_id]
          unique: true
        - name: expires_at_ttl
          fields: [expires_at]
          expire_after_seconds: 0
    reasoning_action_receipts:
      physical_name: platform_reasoning_action_receipts
      schema_version: 1
      indexes:
        - name: action_receipt_unique
          fields: [run_id, node_name, logical_action_id]
          unique: true
        - name: expires_at_ttl
          fields: [expires_at]
          expire_after_seconds: 0
    reasoning_resume_commands:
      physical_name: platform_reasoning_resume_commands
      schema_version: 1
      indexes:
        - name: command_id_unique
          fields: [command_id]
          unique: true
    order_discovery_query_evidence:
      physical_name: platform_order_discovery_query_evidence
      schema_version: 1
      encrypted: true
      indexes:
        - name: query_execution_id_unique
          fields: [query_execution_id]
          unique: true
        - name: expires_at_ttl
          fields: [expires_at]
          expire_after_seconds: 0
    analysis_sessions:
      physical_name: platform_analysis_sessions
      schema_version: 1
      indexes:
        - name: analysis_id_unique
          fields: [analysis_id]
          unique: true
        - name: status
          fields: [status]
    source_snapshots:
      physical_name: platform_source_snapshots
      schema_version: 1
      indexes:
        - name: snapshot_id_unique
          fields: [snapshot_id]
          unique: true
        - name: analysis_id
          fields: [analysis_id]
        # Only snapshots that actually retained samples carry sample_expires_at;
        # metadata is retained indefinitely, so this TTL expires the sample
        # reference without touching the plaintext dataset metadata (13.6).
        - name: sample_expires_at_ttl
          fields: [sample_expires_at]
          expire_after_seconds: 0
    source_samples:
      physical_name: platform_source_samples
      schema_version: 1
      encrypted: true
      indexes:
        - name: samples_ref_unique
          fields: [samples_ref]
          unique: true
        - name: expires_at_ttl
          fields: [expires_at]
          expire_after_seconds: 0
    clarifications:
      physical_name: platform_clarifications
      schema_version: 1
      indexes:
        - name: clarification_id_unique
          fields: [clarification_id]
          unique: true
        - name: analysis_id
          fields: [analysis_id]
    schema_revisions:
      physical_name: platform_schema_revisions
      schema_version: 1
      indexes:
        - name: revision_id_unique
          fields: [revision_id]
          unique: true
        # Append-only history: one sequence number per draft, enforced by the
        # database rather than by the writer, so a concurrent second writer
        # cannot silently produce two "revision 4"s.
        - name: draft_sequence_unique
          fields: [draft_id, sequence]
          unique: true
    validation_results:
      physical_name: platform_validation_results
      schema_version: 1
      indexes:
        - name: result_id_unique
          fields: [result_id]
          unique: true
        - name: draft_revision
          fields: [draft_id, revision_id]
    schema_approvals:
      physical_name: platform_schema_approvals
      schema_version: 1
      indexes:
        - name: approval_id_unique
          fields: [approval_id]
          unique: true
        - name: draft_id
          fields: [draft_id]
