return_policy:
  photo_required_reason_codes:
    - DAMAGED
    - DEFECTIVE
    - WRONG_ITEM
  supported_product_presence:
    - PRESENT_AT_BRANCH
    - OFFSITE_CUSTOMER_RESIDENCE
    - OFFSITE_CUSTOMER_JOBSITE
    - OFFSITE_COMMERCIAL_SITE
    - OFFSITE_VENDOR_SITE
    - OFFSITE_OTHER
    - NOT_APPLICABLE
  # How the parcel-vs-freight class is decided from the product, so Support is
  # told the method rather than asked for it.
  #
  # `_derive_return_method` has always been able to do this -- "the
  # parcel-vs-freight class, from what the product is, never asked" -- and has
  # always answered `None` here, because this block did not exist. So every
  # handoff went out with no method, every case sat on `awaiting:
  # ["RETURN_METHOD"]`, and the Support agent's first message on every thread
  # was "Before the RMA can be issued, please confirm: return method."
  #
  # One freight-class line decides the whole shipment: the parcel network cannot
  # carry it, so a consignment holding a water heater and a box of fittings goes
  # LTL entire. The keywords are matched against the resolved product
  # description and SKU, upper-cased.
  #
  # Derived, not decided. The answer is recorded as a `return_method` fact with
  # `DERIVED` acquisition and travels to Support with that provenance, and
  # Support remains free to record a different one on the outcome -- which
  # supersedes it, as a stated value should.
  return_method_derivation:
    default_method: PREPAID_PARCEL
    freight_method: BRANCH_LTL
    # Observed codes in this corpus: CPU counter pick-up (56%), WCL will-call,
    # OT our truck, XPW express parcel, M mail.
    #
    # CPU and WCL are inferred rows and want operator review, in the sense the
    # requirements table already uses: a customer who collected at the counter
    # can carry it back to the counter, and `BRANCH_UPS` is this catalogue's
    # nearest entry for the branch handling the return leg -- but whether that
    # is what the desk means by it is a business answer, not a reading.
    ship_via_methods:
      CPU: BRANCH_UPS
      WCL: BRANCH_UPS
      OT: BRANCH_LTL
      XPW: PREPAID_PARCEL
      M: PREPAID_PARCEL
    freight_keywords:
      # Water heaters, tanks and boilers -- the commonest LTL class in this
      # catalogue and the one an associate is most likely to meet.
      - WHTR
      - WATER HEATER
      - TKLS
      - TANK
      - BOILER
      - FURN
      # Bath and fixture ware that ships crated.
      - TUB
      - SHOWER BASE
      - TOILET
      - LAVATORY
      - SINK
      # Mechanical plant.
      - CONDENSER
      - AIR HANDLER
      - PUMP
      - COMPRESSOR
      # Length, which is what puts pipe and duct on a truck regardless of weight.
      - PIPE
      - DUCT
  normalized_return_methods:
    - PREPAID_PARCEL
    - BRANCH_UPS
    - BRANCH_LTL
    - OFFSITE_PARCEL
    - OFFSITE_LTL
    - DIRECT_VENDOR
    - FIELD_SCRAP
    - NO_PHYSICAL_RETURN
    - CUSTOMER_KEEP
    - UNKNOWN
  # What each return method needs before the return is business-complete.
  # `awaiting[]` is `required(method) - satisfied(case)` and `businessComplete`
  # is that difference being empty, so this table is the whole definition of
  # "done" for a return -- it sits beside the catalogue above because adding a
  # method without saying what it requires is an incomplete release.
  #
  # Three structural rules, enforced at load rather than described here:
  #   * every row must require RMA -- a method that completes without an
  #     authorization completes without a return;
  #   * no row may name UNKNOWN -- UNKNOWN is the absence of a method, and a row
  #     for it would let an undecided case complete;
  #   * a method with NO row is unmapped, which leaves the completion profile
  #     unresolved and the case awaiting RETURN_METHOD. That is the safe
  #     direction and the reason an empty `requires` list is rejected: "no row"
  #     must never read as "requires nothing".
  #
  # Dimensions: RMA, LABEL, TRACKING, BOL, PICKUP, RETURN_LOCATION.
  return_method_requirements:
    # --- Stated verbatim in the remediation plan (sect. 6.4).
    # RECEIPT on every row whose goods come back to us: the paperwork being
    # complete is not the return being complete, and a case that closed on
    # RMA, label and tracking alone closed with the parcel still on the
    # counter. Satisfied by the warehouse receipt (`POST /api/cases/{id}/receipt`)
    # or a package reading delivered/received; never by a bay recommendation.
    - method: PREPAID_PARCEL
      requires: [RMA, LABEL, TRACKING, RECEIPT]
    - method: BRANCH_LTL
      requires: [RMA, BOL, PICKUP, RECEIPT]
    - method: OFFSITE_LTL
      requires: [RMA, BOL, PICKUP, RETURN_LOCATION, RECEIPT]
    - method: CUSTOMER_KEEP
      requires: [RMA]
    - method: NO_PHYSICAL_RETURN
      requires: [RMA]
    # --- INFERRED FROM THE CATALOGUE -- OPERATOR REVIEW REQUIRED.
    #     The four rows below were derived when the table moved out of code.
    #     The plan does not state them, so each is a reading rather than a
    #     decision, and each is wrong in a way that shows up late: too few
    #     requirements lets a return report itself complete without the
    #     paperwork, too many hangs it forever on an artifact nobody produces.
    #     Confirm each with Returns operations and delete this banner.
    #
    #     A parcel tendered at a branch: the branch is the origin, so there is
    #     no return location to establish, but there is still a label to print
    #     and a number to follow.
    - method: BRANCH_UPS
      requires: [RMA, LABEL, TRACKING, RECEIPT]
    #     A parcel from a customer site -- BRANCH_UPS plus the location, for the
    #     same reason OFFSITE_LTL is BRANCH_LTL plus one.
    - method: OFFSITE_PARCEL
      requires: [RMA, LABEL, TRACKING, RETURN_LOCATION, RECEIPT]
    #     Straight back to the vendor. Somebody has to say where; the carrier
    #     paperwork is the vendor's, not ours.
    - method: DIRECT_VENDOR
      requires: [RMA, RETURN_LOCATION]
    #     Scrapped where it stands. Nothing ships, so nothing but the
    #     authorization can be required -- the same shape as NO_PHYSICAL_RETURN,
    #     reached for a different reason.
    - method: FIELD_SCRAP
      requires: [RMA]
    # --- UNKNOWN has no row, and cannot have one. See the second rule above.
  # Which shipping instruction types tender a bill of lading. Recording
  # shipping instructions of one of these types emits BOL_TENDERED alongside
  # SHIPPING_INSTRUCTIONS_ISSUED, and the same set decides what the acting role
  # has to be authorized for -- the check and the act read one list.
  #
  # Carries both the instruction-type vocabulary Support uses (LTL, BOL,
  # HEAVY_TRUCK_PICKUP) and the normalized return methods above that are
  # freight (BRANCH_LTL, OFFSITE_LTL), because `shippingInstructionType` is
  # populated from either.
  bol_tendering_instruction_types:
    - LTL
    - BOL
    - BRANCH_LTL
    - OFFSITE_LTL
    - HEAVY_TRUCK_PICKUP
  rga_required_product_resolutions:
    - RTV
  heavy_pickup_required_fields:
    - address
    - contact_name
    - contact_phone
    - handling_unit_count
    - estimated_weight
    - dimensions
    - palletized
    - available_windows
  branch_staging:
    require_return_number_tag: true
    allow_manufacturer_box_marking: false
    allow_branch_inventory_addition: false

# The deterministic eligibility gate. Suspended here, in the file, rather than
# only on a published release: an operator's disable lives in the graph
# configuration and does not survive a reset, so the gate came back on by itself
# the moment the release was rebuilt from this file -- which is how a walkthrough
# case ended up routed to REVIEW_REQUIRED on OUTSIDE_STANDARD_RETURN_WINDOW.
#
# Disabling is not an approval and is never read as one: the case records
# `policy_evaluation_state = SKIPPED_BY_CONFIGURATION` and the reason below, with
# no route and no decision, so "no rule was applied" stays distinguishable from
# "a rule approved this". Publishing a policy is unaffected --
# `return_eligibility_policy` below still has to be a valid rule set, because a
# deployment must be able to switch the gate back on without cutting a release.
policy_evaluation:
  enabled: false
  disabled_reason: >-
    Suspended on this development host while order-discovery turns are answered
    through the MANUAL provider. Re-enable before any case that is not a
    walkthrough.

# The deterministic return eligibility rule set. Authority:
# docs/RETURN_COPILOT_POLICY_BASELINE.md -- Ferguson's public Returns and
# Cancellations Policy and Terms and Conditions of Sale (Rev. May 2025).
#
# `percentage` and `amount` are null and typed `None` in the model: Ferguson
# publishes no universal restocking-fee percentage, so a release attempting to
# write one fails to parse rather than shipping an invented number. The engine
# determines that a fee APPLIES; the amount comes from the seller or the
# manufacturer.
return_eligibility_policy:
  id: ferguson-standard-return-policy
  version: "2026-08-15"
  authority: FERGUSON_PUBLIC_TERMS
  source_document: Ferguson Terms and Conditions of Sale
  source_revision: "Terms and Conditions of Sale - Rev. May 2025"
  precedence:
    - CUSTOMER_CONTRACT_OVERRIDE
    - SPECIAL_ORDER_MANUFACTURER_POLICY
    - FERGUSON_STANDARD_RETURN
  standard_stock_return:
    purchase_window: { days: 30, basis: PURCHASE_DATE }
    requirements:
      seller_stocked: true
      special_order: false
      condition:
        new: true
        suitable_for_resale: true
        original_packaging: true
        packaging_undamaged: true
        all_original_parts: true
      prohibited_states:
        used: false
        installed: false
        modified: false
        rebuilt: false
        reconditioned: false
        repaired: false
        altered: false
        damaged: false
    decision_when_satisfied: APPROVE
    conditions:
      - RESTOCKING_FEE_APPLIES
    # WHAT AN UNSTATED CONDITION FACT IS ALLOWED TO DECIDE.
    #
    #   REVIEW_REQUIRED  silence queues the return; nothing approves until the
    #                    conversation has captured all thirteen facts above
    #   NOT_EVALUATED    silence decides nothing; the checks it left unanswered
    #                    are recorded and the return window decides the case
    #
    # Set to NOT_EVALUATED by operator decision (2026-08-16): "only evaluate
    # basic policy -- is the item in the return window". Extraction currently
    # captures `return_reason` and `product_presence` and nothing else, so under
    # REVIEW_REQUIRED every single return queued on REQUIRED_FACT_UNKNOWN and
    # the only route to APPROVE was a supervisor override. That is a rule set
    # that decides nothing.
    #
    # This does NOT weaken the requirements above. A fact somebody *did* state
    # still decides: an item the customer says was installed is still REJECTed,
    # and still rejected before the window is looked at. What changes is only
    # that an unanswered question no longer counts as an objection.
    #
    # Every decision taken this way carries the applied rule
    # CONDITION_FACTS_NOT_EVALUATED together with the names of the checks that
    # were skipped, exactly as STOCK_CLASS_FROM_CONFIGURATION marks a decision
    # taken on an assumed stock class -- so an approval granted on the window
    # alone is never indistinguishable in the audit trail from one granted on
    # full evidence.
    #
    # TO SWITCH THE OTHER CHECKS BACK ON: change this line to REVIEW_REQUIRED
    # and publish. No code change, no deployment. Do it once conversational
    # extraction actually captures the condition and packaging facts, or the
    # returns will simply queue again.
    unstated_condition_facts: NOT_EVALUATED
  # `percentage` and `amount` stay null: Ferguson publishes no universal
  # restocking-fee percentage, so a number there would claim Ferguson's
  # authority for a rate Ferguson has not set.
  #
  # `seller_schedule` is the seller's OWN standing rate. Every determination it
  # produces carries FeeAmountSource.SELLER_CONFIGURATION, so an audit can always
  # tell it from a manufacturer's fee or from published policy. It is a rate in
  # basis points (1500 = 15.00%) rather than a currency amount because the
  # evaluator is pure and holds no line prices; the figure is computed downstream
  # where order_line.net_price exists.
  #
  # ---------------------------------------------------------------------------
  # DEV RATE -- ACCEPTED BY THE OPERATOR FOR NON-PRODUCTION USE (2026-08-15).
  # 1500 bp (15%) is an arbitrary working figure so the lifecycle can complete and
  # a refund can render. It is NOT sourced from any Ferguson document and carries
  # no business authority.
  #
  # This is deliberately still loud. The operator's decision was "it's dev, put a
  # number in" -- which settles this environment, not the next one. Before any
  # live deployment, replace it with the seller's real schedule, or remove
  # `seller_schedule` entirely to go back to emitting applicability with no figure
  # attached. `FeeAmountSource.SELLER_CONFIGURATION` on every outcome it produces
  # is what keeps it from ever passing as published Ferguson policy in the interim.
  # ---------------------------------------------------------------------------
  restocking_fee:
    applies_by_default: true
    percentage: null
    amount: null
    amount_source: [SELLER_CONFIGURATION, SELLER_OVERRIDE, MANUFACTURER]
    seller_can_waive: true
    invent_default_amount: false
    seller_schedule:
      default_rate_basis_points: 1500
      currency: USD
  # WHERE STOCKED-VS-SPECIAL-ORDER COMES FROM.
  #
  # Not from the source. Verified 2026-08-15 against the real `salesInv` extract:
  # no field carries the distinction. `lineType` is the only candidate and it is
  # undocumented in all four Ferguson vendor dictionaries; its `MP` majority
  # contains 89 procure-to-order lines (`taggedPoId` with `prodAvailQty == 0`)
  # sitting exactly on the "normally stocked" seam, so reading `MP` as "stocked"
  # would turn 89 unknowns into approval evidence. Ferguson's public policy
  # describes what happens TO a special order; it does not say which products
  # ARE one.
  #
  # So the operator says, here, and can change it without code.
  #
  #   unresolved_default:
  #     STANDARD_STOCK   unclassified lines are ordinary stock; returns flow
  #     SPECIAL_ORDER    unclassified lines take the manufacturer path
  #     REVIEW_REQUIRED  leave unknown; every return queues for a human
  #
  # Set to STANDARD_STOCK by operator decision: the alternative queues every
  # return, which is safe but decides nothing. Every decision taken this way
  # carries the applied rule STOCK_CLASS_FROM_CONFIGURATION, so an approval made
  # on this assumption is distinguishable in the audit trail from one made on
  # evidence. Change this line to REVIEW_REQUIRED to go back to fail-safe.
  #
  # The designation lists override the default for named products. They are
  # empty on purpose. The reference data shows 8 `SP`-prefixed master product
  # ids that look like special orders (all with `taggedPoId`, all
  # `cntrtCostType: P`) -- but the same `SP` token appears as `origProdStatus`
  # on four ordinary catalogue products, and no vendor document defines either.
  # Adding "SP" to special_order_sku_prefixes is an assertion for an operator to
  # make, not a guess for this file to ship.
  stock_classification:
    unresolved_default: STANDARD_STOCK
    special_order_skus: []
    special_order_sku_prefixes: []
    special_order_product_ids: []

  special_or_nonstock:
    manufacturer_acceptance_required: true
    buyer_fee_acceptance_required: true
    decisions:
      manufacturer_acceptance_unknown: REVIEW_REQUIRED
      manufacturer_acceptance_rejected: REJECT
      manufacturer_acceptance_accepted_buyer_fee_unknown: REVIEW_REQUIRED
      manufacturer_acceptance_accepted_buyer_fee_rejected: REJECT
      manufacturer_acceptance_accepted_buyer_fee_accepted: APPROVE
  outside_standard_window:
    decision: REVIEW_REQUIRED
    reason_code: OUTSIDE_STANDARD_RETURN_WINDOW
  delivery_claim:
    conditions: [SHIPPING_DAMAGE, SHORTAGE, SHIPMENT_ERROR, IMPROPER_DELIVERY]
    reporting_window: { business_days: 2, basis: DELIVERY_DATE }
  warranty_issue:
    reasons:
      - MANUFACTURING_DEFECT
      - PRODUCT_FAILURE_AFTER_INSTALLATION
      - COVERED_PRIVATE_LABEL_DEFECT
      - MANUFACTURER_WARRANTY_ISSUE

