# The deterministic return eligibility rule set. Authority:
# docs/RETURN_COPILOT_POLICY_BASELINE.md -- Ferguson's public Returns and
# Cancellations Policy and Terms and Conditions of Sale (Rev. May 2025).
#
# `percentage` and `amount` are null and typed `None` in the model: Ferguson
# publishes no universal restocking-fee percentage, so a release attempting to
# write one fails to parse rather than shipping an invented number. The engine
# determines that a fee APPLIES; the amount comes from the seller or the
# manufacturer.
return_eligibility_policy:
  id: ferguson-standard-return-policy
  version: "2026-08-15"
  authority: FERGUSON_PUBLIC_TERMS
  source_document: Ferguson Terms and Conditions of Sale
  source_revision: "Terms and Conditions of Sale - Rev. May 2025"
  precedence:
    - CUSTOMER_CONTRACT_OVERRIDE
    - SPECIAL_ORDER_MANUFACTURER_POLICY
    - FERGUSON_STANDARD_RETURN
  standard_stock_return:
    purchase_window: { days: 30, basis: PURCHASE_DATE }
    requirements:
      seller_stocked: true
      special_order: false
      condition:
        new: true
        suitable_for_resale: true
        original_packaging: true
        packaging_undamaged: true
        all_original_parts: true
      prohibited_states:
        used: false
        installed: false
        modified: false
        rebuilt: false
        reconditioned: false
        repaired: false
        altered: false
        damaged: false
    decision_when_satisfied: APPROVE
    conditions:
      - RESTOCKING_FEE_APPLIES
    # WHAT AN UNSTATED CONDITION FACT IS ALLOWED TO DECIDE.
    #
    #   REVIEW_REQUIRED  silence queues the return; nothing approves until the
    #                    conversation has captured all thirteen facts above
    #   NOT_EVALUATED    silence decides nothing; the checks it left unanswered
    #                    are recorded and the return window decides the case
    #
    # Set to NOT_EVALUATED by operator decision (2026-08-16): "only evaluate
    # basic policy -- is the item in the return window". Extraction currently
    # captures `return_reason` and `product_presence` and nothing else, so under
    # REVIEW_REQUIRED every single return queued on REQUIRED_FACT_UNKNOWN and
    # the only route to APPROVE was a supervisor override. That is a rule set
    # that decides nothing.
    #
    # This does NOT weaken the requirements above. A fact somebody *did* state
    # still decides: an item the customer says was installed is still REJECTed,
    # and still rejected before the window is looked at. What changes is only
    # that an unanswered question no longer counts as an objection.
    #
    # Every decision taken this way carries the applied rule
    # CONDITION_FACTS_NOT_EVALUATED together with the names of the checks that
    # were skipped, exactly as STOCK_CLASS_FROM_CONFIGURATION marks a decision
    # taken on an assumed stock class -- so an approval granted on the window
    # alone is never indistinguishable in the audit trail from one granted on
    # full evidence.
    #
    # TO SWITCH THE OTHER CHECKS BACK ON: change this line to REVIEW_REQUIRED
    # and publish. No code change, no deployment. Do it once conversational
    # extraction actually captures the condition and packaging facts, or the
    # returns will simply queue again.
    unstated_condition_facts: NOT_EVALUATED
  # `percentage` and `amount` stay null: Ferguson publishes no universal
  # restocking-fee percentage, so a number there would claim Ferguson's
  # authority for a rate Ferguson has not set.
  #
  # `seller_schedule` is the seller's OWN standing rate. Every determination it
  # produces carries FeeAmountSource.SELLER_CONFIGURATION, so an audit can always
  # tell it from a manufacturer's fee or from published policy. It is a rate in
  # basis points (1500 = 15.00%) rather than a currency amount because the
  # evaluator is pure and holds no line prices; the figure is computed downstream
  # where order_line.net_price exists.
  #
  # ---------------------------------------------------------------------------
  # DEV RATE -- ACCEPTED BY THE OPERATOR FOR NON-PRODUCTION USE (2026-08-15).
  # 1500 bp (15%) is an arbitrary working figure so the lifecycle can complete and
  # a refund can render. It is NOT sourced from any Ferguson document and carries
  # no business authority.
  #
  # This is deliberately still loud. The operator's decision was "it's dev, put a
  # number in" -- which settles this environment, not the next one. Before any
  # live deployment, replace it with the seller's real schedule, or remove
  # `seller_schedule` entirely to go back to emitting applicability with no figure
  # attached. `FeeAmountSource.SELLER_CONFIGURATION` on every outcome it produces
  # is what keeps it from ever passing as published Ferguson policy in the interim.
  # ---------------------------------------------------------------------------
  restocking_fee:
    applies_by_default: true
    percentage: null
    amount: null
    amount_source: [SELLER_CONFIGURATION, SELLER_OVERRIDE, MANUFACTURER]
    seller_can_waive: true
    invent_default_amount: false
    seller_schedule:
      default_rate_basis_points: 1500
      currency: USD
  # WHERE STOCKED-VS-SPECIAL-ORDER COMES FROM.
  #
  # Not from the source. Verified 2026-08-15 against the real `salesInv` extract:
  # no field carries the distinction. `lineType` is the only candidate and it is
  # undocumented in all four Ferguson vendor dictionaries; its `MP` majority
  # contains 89 procure-to-order lines (`taggedPoId` with `prodAvailQty == 0`)
  # sitting exactly on the "normally stocked" seam, so reading `MP` as "stocked"
  # would turn 89 unknowns into approval evidence. Ferguson's public policy
  # describes what happens TO a special order; it does not say which products
  # ARE one.
  #
  # So the operator says, here, and can change it without code.
  #
  #   unresolved_default:
  #     STANDARD_STOCK   unclassified lines are ordinary stock; returns flow
  #     SPECIAL_ORDER    unclassified lines take the manufacturer path
  #     REVIEW_REQUIRED  leave unknown; every return queues for a human
  #
  # Set to STANDARD_STOCK by operator decision: the alternative queues every
  # return, which is safe but decides nothing. Every decision taken this way
  # carries the applied rule STOCK_CLASS_FROM_CONFIGURATION, so an approval made
  # on this assumption is distinguishable in the audit trail from one made on
  # evidence. Change this line to REVIEW_REQUIRED to go back to fail-safe.
  #
  # The designation lists override the default for named products. They are
  # empty on purpose. The reference data shows 8 `SP`-prefixed master product
  # ids that look like special orders (all with `taggedPoId`, all
  # `cntrtCostType: P`) -- but the same `SP` token appears as `origProdStatus`
  # on four ordinary catalogue products, and no vendor document defines either.
  # Adding "SP" to special_order_sku_prefixes is an assertion for an operator to
  # make, not a guess for this file to ship.
  stock_classification:
    unresolved_default: STANDARD_STOCK
    special_order_skus: []
    special_order_sku_prefixes: []
    special_order_product_ids: []

  special_or_nonstock:
    manufacturer_acceptance_required: true
    buyer_fee_acceptance_required: true
    decisions:
      manufacturer_acceptance_unknown: REVIEW_REQUIRED
      manufacturer_acceptance_rejected: REJECT
      manufacturer_acceptance_accepted_buyer_fee_unknown: REVIEW_REQUIRED
      manufacturer_acceptance_accepted_buyer_fee_rejected: REJECT
      manufacturer_acceptance_accepted_buyer_fee_accepted: APPROVE
  outside_standard_window:
    decision: REVIEW_REQUIRED
    reason_code: OUTSIDE_STANDARD_RETURN_WINDOW
  delivery_claim:
    conditions: [SHIPPING_DAMAGE, SHORTAGE, SHIPMENT_ERROR, IMPROPER_DELIVERY]
    reporting_window: { business_days: 2, basis: DELIVERY_DATE }
  warranty_issue:
    reasons:
      - MANUFACTURING_DEFECT
      - PRODUCT_FAILURE_AFTER_INSTALLATION
      - COVERED_PRIVATE_LABEL_DEFECT
      - MANUFACTURER_WARRANTY_ISSUE

# The return-shipment status catalog. Two ladders, because the product decides
# parcel vs freight; every code, label, transition and colour is operator
# configuration -- a status code appearing in Python or JSX is a defect.
shipment_tracking:
  initial_status_parcel: label_created
  initial_status_freight: bol_created
  freight_methods:
    - BRANCH_LTL
    - OFFSITE_LTL
  collection: shipmentInfo
  fields: {}
  statuses:
    # ---- parcel ladder -----------------------------------------------------
    - code: label_created
      label: Label created
      ladder: parcel
      ordinal: 0
      color_token: progress
      allowed_next: [picked_up, exception, return_to_sender]
    - code: picked_up
      label: Picked up
      ladder: parcel
      ordinal: 1
      color_token: progress
      allowed_next: [in_transit, exception, return_to_sender]
    - code: in_transit
      label: In transit
      ladder: parcel
      ordinal: 2
      color_token: progress
      allowed_next: [arrived_at_facility, out_for_delivery, exception, return_to_sender]
    - code: arrived_at_facility
      label: Arrived at facility
      ladder: parcel
      ordinal: 3
      color_token: progress
      allowed_next: [in_transit, out_for_delivery, exception, return_to_sender]
    - code: out_for_delivery
      label: Out for delivery
      ladder: parcel
      ordinal: 4
      color_token: progress
      allowed_next: [delivered, delivery_attempted, exception, return_to_sender]
    - code: delivered
      label: Delivered
      ladder: parcel
      ordinal: 5
      terminal: true
      color_token: success
      allowed_next: []
    - code: delivery_attempted
      label: Delivery attempted
      ladder: parcel
      ordinal: 4
      exception_state: true
      color_token: warning
      allowed_next: [out_for_delivery, in_transit, exception, return_to_sender]
    - code: exception
      label: Exception
      ladder: parcel
      ordinal: 2
      exception_state: true
      color_token: error
      allowed_next: [picked_up, in_transit, arrived_at_facility, out_for_delivery, return_to_sender]
    - code: return_to_sender
      label: Return to sender
      ladder: parcel
      ordinal: 5
      terminal: true
      color_token: error
      allowed_next: []
    # ---- freight / LTL ladder ----------------------------------------------
    - code: bol_created
      label: BOL created
      ladder: freight
      ordinal: 0
      color_token: progress
      allowed_next: [pending_pickup, exception]
    - code: pending_pickup
      label: Pending pickup
      ladder: freight
      ordinal: 1
      color_token: progress
      allowed_next: [picked_up, exception]
    - code: picked_up
      label: Picked up
      ladder: freight
      ordinal: 2
      color_token: progress
      allowed_next: [at_origin_terminal, exception, on_hand]
    - code: at_origin_terminal
      label: At origin terminal
      ladder: freight
      ordinal: 3
      color_token: progress
      allowed_next: [in_transit, on_hand, exception]
    - code: in_transit
      label: In transit
      ladder: freight
      ordinal: 4
      color_token: progress
      allowed_next: [at_destination_terminal, on_hand, exception]
    - code: at_destination_terminal
      label: At destination terminal
      ladder: freight
      ordinal: 5
      color_token: progress
      allowed_next: [out_for_delivery, on_hand, exception]
    - code: out_for_delivery
      label: Out for delivery
      ladder: freight
      ordinal: 6
      color_token: progress
      allowed_next: [delivered, on_hand, exception]
    - code: delivered
      label: Delivered
      ladder: freight
      ordinal: 7
      terminal: true
      color_token: success
      allowed_next: []
    - code: on_hand
      label: On hand at terminal
      ladder: freight
      ordinal: 4
      exception_state: true
      color_token: warning
      allowed_next: [in_transit, at_destination_terminal, out_for_delivery, exception]
    - code: exception
      label: Exception
      ladder: freight
      ordinal: 4
      exception_state: true
      color_token: error
      allowed_next: [pending_pickup, picked_up, at_origin_terminal, in_transit, at_destination_terminal, out_for_delivery, on_hand]

# The support-handoff template (contracts.md sect. 8). The default variant
# reproduces the text `compose_support_handoff` composes today -- line for
# line, on every branch its conditionals take, which
# `TestComposedEquivalenceMatrix` renders and compares case by case. The one
# thing it does not reproduce is the *subject*: `_subject` joins its parts
# conditionally and shortens them, and sect. 8's subject grammar is
# interpolation only, so the subject here is a different (and simpler) line by
# contract rather than by oversight.
#
# Four of today's lines are conditional -- the contact block's two arms, the
# unresolved-bay reason, the manual-bay action, the outstanding-support list --
# and the sect. 8 clause grammar describes the shape of a *case*
# (shipping mode, reason class, order source, item count), never the presence
# of a value. Those lines are therefore bound to keys that
# `operations/support_template_draft.py` makes **present or absent**, with no
# `fallback`: an absent key omits its line, exactly as the composed path omits
# it. Giving them a fallback is what made the first version of this block
# silently print "Not available" where the truth was "no bay could be
# recommended, resolve manually".
#
# Formatters are ids from the code-side allowlist; `literal:` bindings are
# constant text (contracts.md AMENDMENT-1). Every `case_fact:` name is declared
# in `support_template_draft.TEMPLATE_CASE_FACT_KEYS`, and a test compares this
# block against it in both directions.
support_template:
  template_id: support-handoff
  default_variant_id: default
  variants:
    - variant_id: default
      # Deliberately clause-less: a rule with no clauses matches nothing, and
      # this variant renders because it is named default, not because it was
      # listed first.
      selector: {}
      subject_template: "Return {order_number} · {customer_name}"
      sections:
        - &tpl_sec_banner
          section_id: banner
          title: RETURN SUPPORT REQUEST
        - &tpl_sec_case
          section_id: case
          title: "Case:"
          fields:
            - field_id: case_id
              label: Case ID
              source_binding: "case_fact:case_id"
              required: true
            - field_id: work_item_id
              label: Work Item ID
              source_binding: "case_fact:work_item_id"
              fallback: Not available
            - field_id: created_at
              label: Created Date/Time
              source_binding: "case_fact:created_at"
              formatter: date
              fallback: Not available
            - field_id: workflow_status
              label: Workflow Status at Handoff
              source_binding: "case_fact:workflow_status_at_handoff"
              fallback: Not available
        - &tpl_sec_customer
          section_id: customer
          title: "Customer:"
          fields:
            - field_id: customer_name
              label: Customer Name
              source_binding: "case_fact:customer_name"
              fallback: Not available
            - field_id: customer_reference
              label: Customer Reference
              source_binding: "case_fact:customer_id"
              fallback: Not available
            - field_id: customer_account
              label: Account
              source_binding: "case_fact:customer_account"
              fallback: Not available
            # The contact block, two mutually exclusive arms. Exactly one arm's
            # three keys is ever present, so the other arm's three lines are
            # omitted -- never rendered as "Not available", which is what lost
            # the customer's own phone and email on every case with no named
            # branch associate. No `fallback` on any of the six, on purpose.
            - field_id: contact_associate_name
              label: Branch Associate
              source_binding: "case_fact:contact_associate_name"
            - field_id: contact_associate_email
              label: Branch Associate Email
              source_binding: "case_fact:contact_associate_email"
            - field_id: contact_associate_phone
              label: Branch Associate Phone
              source_binding: "case_fact:contact_associate_phone"
            - field_id: contact_customer_notice
              label: Branch Associate
              source_binding: "case_fact:contact_customer_notice"
            - field_id: contact_customer_phone
              label: Customer Phone
              source_binding: "case_fact:contact_customer_phone"
            - field_id: contact_customer_email
              label: Customer Email
              source_binding: "case_fact:contact_customer_email"
        - &tpl_sec_order
          section_id: order
          title: "Order:"
          fields:
            - field_id: order_number
              label: Order Number
              source_binding: "case_fact:confirmed_order_reference"
              fallback: Not available
            - field_id: selected_items
              source_binding: "case_fact:selected_items"
              formatter: item_list
              fallback: "- Selected lines: Not available"
        - &tpl_sec_return_details
          section_id: return_details
          title: "Return Details:"
          fields:
            - field_id: return_method
              label: Return Method
              source_binding: "case_fact:return_method"
              fallback: Not available
            - field_id: requested_resolution
              label: Requested Resolution
              source_binding: "case_fact:requested_resolution"
              fallback: Not available
            - field_id: product_presence
              label: Product Presence
              source_binding: "case_fact:product_presence"
              fallback: Not available
            # Whatever else the release requires, already labelled by the
            # release rather than by this template -- which is what lets a
            # release add a required detail without either being edited.
            # Absent when the case carries none.
            - field_id: return_details_additional
              source_binding: "case_fact:return_details_additional"
            # The rendered notes, not the raw fact: anything in an associate's
            # words that could impersonate this message's framing is stripped
            # before it gets here, and binding the raw fact would drop that.
            - field_id: associate_notes
              label: Associate Notes
              source_binding: "case_fact:associate_notes_rendered"
              fallback: Not available
        - &tpl_sec_bay
          section_id: bay_assignment
          title: "Bay Assignment:"
          fields:
            - field_id: bay_status
              label: Assignment Status
              source_binding: "case_fact:bay_assignment_status"
              fallback: UNRESOLVED
            - field_id: bay_reference
              label: Recommended Bay
              source_binding: "case_fact:bay_reference"
              fallback: Not available
            - field_id: bay_warehouse
              label: Warehouse/Branch
              source_binding: "case_fact:bay_warehouse_reference"
              fallback: Not available
            - field_id: bay_return_location
              label: Return Location
              source_binding: "case_fact:bay_return_location"
              fallback: Not available
            - field_id: bay_handling
              label: Handling/Staging Instructions
              source_binding: "case_fact:bay_handling_instructions"
              fallback: Not available
            # Present only when no bay was recommended, which is exactly when
            # Support needs it. No fallback: absence omits the line.
            - field_id: bay_unresolved_reason
              label: Unresolved Reason
              source_binding: "case_fact:bay_unresolved_reason"
        - &tpl_sec_verification
          section_id: verification
          title: "Verification:"
          fields:
            - field_id: order_confirmation
              label: Order Confirmation
              source_binding: "case_fact:order_confirmation"
              fallback: Not confirmed
            - field_id: required_return_information
              label: Required Return Information
              source_binding: "case_fact:required_return_information"
              fallback: Incomplete
            # Three states, and the third is silence: nothing outstanding omits
            # the line, an unreadable case state says so in words. "Nothing is
            # outstanding" and "we could not find out" send Support to opposite
            # actions, so neither may render as the other.
            - field_id: awaiting_from_support
              label: Awaiting From Support
              source_binding: "case_fact:awaiting_from_support"
            - field_id: policy_evaluation
              label: Policy Evaluation
              source_binding: "case_fact:policy_evaluation_rendered"
              fallback: Not evaluated
            - field_id: bay_source
              label: Bay Assignment Source
              source_binding: "literal:Bay Assignment Agent"
        - section_id: requested_action
          title: "Requested Support Action:"
          fields:
            - field_id: action_review
              source_binding: "literal:- Review the complete return request."
            - field_id: action_bay
              source_binding: "literal:- Review or confirm the bay recommendation."
            - field_id: manual_bay_action
              source_binding: "case_fact:manual_bay_action_line"
            - field_id: action_verify
              source_binding: "literal:- Verify all Support-owned conditions, including warranty when applicable."
            - field_id: action_rma
              source_binding: "literal:- Create or decline the RMA through the authoritative Support workflow."
    - variant_id: parcel
      selector:
        shipping_modes: [PREPAID_PARCEL, OFFSITE_PARCEL]
      subject_template: "Return {order_number} · {customer_name}"
      sections:
        - *tpl_sec_banner
        - *tpl_sec_case
        - *tpl_sec_customer
        - *tpl_sec_order
        - *tpl_sec_return_details
        - *tpl_sec_bay
        - *tpl_sec_verification
        - section_id: requested_action
          title: "Requested Support Action:"
          fields:
            - field_id: action_review
              source_binding: "literal:- Review the complete return request."
            - field_id: action_bay
              source_binding: "literal:- Review or confirm the bay recommendation."
            - field_id: manual_bay_action
              source_binding: "case_fact:manual_bay_action_line"
            - field_id: action_label
              source_binding: "literal:- Issue the prepaid parcel return label."
            - field_id: action_verify
              source_binding: "literal:- Verify all Support-owned conditions, including warranty when applicable."
            - field_id: action_rma
              source_binding: "literal:- Create or decline the RMA through the authoritative Support workflow."
    - variant_id: ltl
      selector:
        shipping_modes: [BRANCH_LTL, OFFSITE_LTL]
      subject_template: "Return {order_number} · {customer_name}"
      sections:
        - *tpl_sec_banner
        - *tpl_sec_case
        - *tpl_sec_customer
        - *tpl_sec_order
        - *tpl_sec_return_details
        - *tpl_sec_bay
        - *tpl_sec_verification
        - section_id: requested_action
          title: "Requested Support Action:"
          fields:
            - field_id: action_review
              source_binding: "literal:- Review the complete return request."
            - field_id: action_bay
              source_binding: "literal:- Review or confirm the bay recommendation."
            - field_id: manual_bay_action
              source_binding: "case_fact:manual_bay_action_line"
            - field_id: action_freight
              source_binding: "literal:- Arrange LTL freight pickup and issue the Bill of Lading."
            - field_id: action_verify
              source_binding: "literal:- Verify all Support-owned conditions, including warranty when applicable."
            - field_id: action_rma
              source_binding: "literal:- Create or decline the RMA through the authoritative Support workflow."
