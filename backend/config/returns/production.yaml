schema_version: "1.0"
assumption_set_version: "FERGUSON-RETURN-ASSUMPTIONS-1.0"

agents:
  order_discovery:
    name: "Order Discovery Agent"
    version: "2.0"
    enabled: true
    ai_assisted: true
    human_confirmation_required: true
    capabilities:
      - normalize_evidence
      - classify_order_source
      - rank_candidates
      - explain_candidate_evidence
      - recommend_dynamic_clarification
  return_workflow:
    name: "Return Workflow Agent"
    version: "2.0"
    enabled: true
    ai_assisted: true
    human_confirmation_required: true
    capabilities:
      - identify_missing_fields
      - enforce_evidence_requirements
      - recommend_physical_path
      - draft_support_request
      - summarize_clarification
  return_fulfillment:
    name: "Return Fulfillment Agent"
    version: "2.0"
    enabled: true
    ai_assisted: false
    human_confirmation_required: false
    capabilities:
      - normalize_omc_status
      - distinguish_rma_rga
      - interpret_parcel_and_freight_state
      - detect_stale_or_conflicting_evidence
  bay_assignment:
    name: "Bay Assignment Agent"
    version: "2.0"
    enabled: true
    ai_assisted: false
    human_confirmation_required: true
    capabilities:
      - filter_eligible_bays
      - rank_bays
      - recommend_overflow_or_hold
      - explain_exclusions
  feedback_learning:
    name: "Feedback Learning Agent"
    version: "2.0"
    enabled: true
    ai_assisted: true
    human_confirmation_required: true
    capabilities:
      - calculate_operational_metrics
      - detect_rework_patterns
      - detect_assumption_mismatches
      - recommend_policy_changes

discovery:
  web_order_pattern: "^W[0-9]{9,12}$"
  ambiguity_gap_millionths: 100000
  auto_confirmation_allowed: false
  anchor_weights:
    ORDER_NUMBER: 1000000
    CUSTOMER_ID: 900000
    TRACKING_NUMBER: 850000
    PHONE: 650000
    EMAIL: 650000
    SKU: 450000
    CUSTOMER_NAME: 300000
    PRODUCT_DESCRIPTION: 250000
  conflict_penalty_millionths: 300000
  strong_anchors:
    - ORDER_NUMBER
    - CUSTOMER_ID
    - TRACKING_NUMBER
  anchor_extractors:
    - anchor_type: ORDER_NUMBER
      patterns:
        - "^W[0-9]{9,12}$"
        - "\\b(?:ORD|SO)-[A-Z0-9-]{3,}\\b"
        - "\\bW[0-9]{9,12}\\b"
    - anchor_type: CUSTOMER_ID
      patterns:
        - "\\b(?:CUST|PTY)-[A-Z0-9-]{3,}\\b"
    - anchor_type: TRACKING_NUMBER
      patterns:
        - "\\b1Z[A-Z0-9]{10,}\\b"
    - anchor_type: PHONE
      patterns:
        - "(?<!\\w)\\+?[0-9][0-9 ()-]{7,}[0-9](?!\\w)"
    - anchor_type: EMAIL
      patterns:
        - "\\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}\\b"
    - anchor_type: SKU
      patterns:
        - "\\b(?:SKU|PRD)-[A-Z0-9-]{3,}\\b"
  free_text_fallback_anchor: PRODUCT_DESCRIPTION
  conversation:
    greeting_patterns:
      - "^(?:hi|hello|hey|greetings|good\\s+(?:morning|afternoon|evening)|help|start|howdy|hi\\s+there|hello\\s+there)[\\s!.,]*$"
    greeting_response: "Hello! I am your AI Returns Assistant. I can help you locate customer orders, verify return eligibility, and process RMA requests. To get started, please share an order number (e.g., SO-00010001 or W000000001), customer ID, tracking number, or SKU."
    greeting_status: "AWAITING_ANCHOR"
    greeting_title: "Return Assistance"
    initial_match_template: "I located {count} matching order(s) for {anchor_type} '{anchor_value}'. Please review the evidence below and confirm the exact customer and order line to proceed."
    initial_no_match_template: "I searched our order records for {anchor_type} '{anchor_value}', but couldn't find a direct match. Could you provide another identifier such as an order number, customer ID, tracking number, or SKU?"
    continue_match_template: "Great! Using {anchor_type} '{anchor_value}', I found {count} matching candidate order(s). Please review the updated list and confirm the item being returned."
    continue_no_match_template: "I checked for {anchor_type} '{anchor_value}', but still couldn't locate a matching order in our systems. Please double-check the number or try searching by customer phone, email, or exact SKU."
    confirmation_associate_template: "Confirmed order {order_reference}, line item {order_line_id}."
    confirmation_assistant_template: "Order line {order_line_id} is now locked for return processing. Please provide the return reason, quantity, number of packages, preferred shipping method, and any optional notes."
    submission_associate_template: "Confirmed return handling details."
    submission_assistant_template: "Return session {session_id} has been created and transferred to Return Support processing."
  progressive:
    enabled: true
    customer_fulltext_index: customer_name_search_v2
    product_fulltext_index: product_description_search_v2
    candidate_limit: 10
    max_edit_distance: 2
    one_edit_min_token_length: 4
    two_edit_min_token_length: 8
    candidate_ttl_seconds: 900
    max_clarification_options: 10
    dialogue_states:
      no_candidates: ENTITY_IDENTIFICATION
      single_candidate: LINE_SELECTION
      slot_disambiguation: CUSTOMER_DISAMBIGUATION
      generic_disambiguation: ORDER_DISAMBIGUATION
    weak_anchor_source_fallback_enabled: true
    weak_anchor_targeted_graph_upsert_enabled: false
    fuzzy_search_anchors:
      - CUSTOMER_NAME
      - PRODUCT_DESCRIPTION
    disambiguation_attributes:
      - slot: customer_name
        candidate_field: customerName
        label: "customer name"
        priority: 120
      - slot: billing_city
        candidate_field: billingCity
        label: "customer account city"
        priority: 100
      - slot: postal_code
        candidate_field: postalCode
        label: "customer account postal code"
        priority: 90
      - slot: account_type
        candidate_field: accountType
        label: "customer account type"
        priority: 80
      - slot: product_description
        candidate_field: productDescription
        label: "product"
        priority: 75
      - slot: order_status
        candidate_field: orderStatus
        label: "order status"
        priority: 70
      - slot: order_number
        candidate_field: orderReference
        label: "order number"
        priority: 10

source_resolution:
  sales_invoice_collection: salesInv
  customer_collection: customerOutboundCDM
  shipment_collection: shipmentInfo
  product_collection: lkpSearchProduct
  order_number_paths:
    - salesHdrEventData.orderId
    - salesHdr.salesHdrData.orderId
  web_order_paths:
    - salesHdrEventData.webOrderId
    - salesHdrEventData.webOrderNumber
    - salesHdr.salesHdrData.webOrderId
    - salesHdr.salesHdrData.webOrderNumber
  trilogie_order_paths:
    - salesHdrEventData.trilOrdNum
    - salesHdrEventData.orderId
    - salesHdr.salesHdrData.trilOrdNum
  customer_id_paths:
    - salesHdr.salesHdrData.custId
    - salesHdrEventData.customerId
  customer_name_paths:
    - salesHdr.salesHdrData.custName
    - salesHdrEventData.customerName
  customer_city_paths:
    - salesHdr.salesHdrData.billToCity
    - salesHdrEventData.billingCity
    - salesHdrEventData.city
  customer_postal_code_paths:
    - salesHdr.salesHdrData.billToZip
    - salesHdrEventData.billingPostalCode
    - salesHdrEventData.postalCode
  customer_account_type_paths:
    - salesHdr.salesHdrData.accountType
    - salesHdrEventData.accountType
    - salesHdrEventData.customerName
  line_id_paths:
    - orderLineId
    - lineId
    - salesLineId
  product_id_paths:
    - productId
    - productUniqueId
  sku_paths:
    - sku
    - modelNumber
  product_description_paths:
    - productDesc
    - productDescription
  shipped_quantity_paths:
    - shipQty
    - shippedQuantity
    - quantityShipped
  phone_field: phoneNumber
  email_field: email
  customer_master_id_field: customerId
  tracking_field: shipmentInfoEventData.trkNum
  tracking_order_field: shipmentInfoEventData.trilOrdNum

clarification_policy:
  version: v2
  max_prompts_per_turn: 1
  max_fields_per_turn: 1
  phrasing_owner: LLM
  field_selection_owner: LLM
  fields:
    - field: order_number
      label: "Ferguson order number or web order number"
      priority: 120
      customer_answerable: true
      field_group: ORDER_ANCHOR
      anchor_type: ORDER_NUMBER
      candidate_field: orderReference
    - field: customer_id
      label: "customer ID"
      priority: 115
      customer_answerable: true
      field_group: CUSTOMER_ANCHOR
      anchor_type: CUSTOMER_ID
      candidate_field: customerReference
    - field: tracking_number
      label: "tracking number"
      priority: 110
      customer_answerable: true
      field_group: SHIPMENT_ANCHOR
      anchor_type: TRACKING_NUMBER
    - field: invoice_number
      label: "invoice number"
      priority: 105
      customer_answerable: true
      field_group: ORDER_ANCHOR
    - field: customer_po_number
      label: "customer PO number"
      priority: 100
      customer_answerable: true
      field_group: ORDER_ANCHOR
    - field: email
      label: "email used on the order"
      priority: 95
      customer_answerable: true
      field_group: CUSTOMER_ANCHOR
      anchor_type: EMAIL
    - field: phone
      label: "phone number used on the order"
      priority: 90
      customer_answerable: true
      field_group: CUSTOMER_ANCHOR
      anchor_type: PHONE
    - field: customer_name
      label: "name on the order"
      priority: 85
      customer_answerable: true
      field_group: CUSTOMER_NARROWING
      anchor_type: CUSTOMER_NAME
      candidate_field: customerName
    - field: company_name
      label: "company name"
      priority: 80
      customer_answerable: true
      field_group: CUSTOMER_NARROWING
    - field: zip_code
      label: "ZIP code on the order"
      priority: 75
      customer_answerable: true
      field_group: CUSTOMER_NARROWING
      candidate_field: postalCode
    - field: product_sku
      label: "SKU or item number"
      priority: 70
      customer_answerable: true
      field_group: LINE_NARROWING
      anchor_type: SKU
      candidate_field: sku
    - field: product_description
      label: "product description"
      priority: 65
      customer_answerable: true
      field_group: LINE_NARROWING
      anchor_type: PRODUCT_DESCRIPTION
      candidate_field: productDescription
    - field: approximate_purchase_date
      label: "approximate purchase date"
      priority: 60
      customer_answerable: true
      field_group: DATE_NARROWING
    - field: purchase_channel_hint
      label: "where the order was placed"
      priority: 55
      customer_answerable: true
      field_group: SOURCE_NARROWING
    - field: product_presence
      label: "current product location"
      priority: 50
      customer_answerable: true
      field_group: RETURN_CONTEXT
    - field: return_reason
      label: "reason for return"
      priority: 45
      customer_answerable: true
      field_group: RETURN_CONTEXT
  goals:
    IDENTIFY_ORDER:
      preferred_field_groups:
        - ORDER_ANCHOR
        - SHIPMENT_ANCHOR
        - CUSTOMER_ANCHOR
        - DATE_NARROWING
      preferred_fields:
        - order_number
        - tracking_number
        - customer_id
        - invoice_number
        - customer_po_number
        - email
        - phone
        - approximate_purchase_date
    IDENTIFY_CUSTOMER:
      preferred_field_groups:
        - CUSTOMER_ANCHOR
        - CUSTOMER_NARROWING
      preferred_fields:
        - customer_id
        - phone
        - email
        - customer_name
        - company_name
        - zip_code
    IDENTIFY_ORDER_LINE:
      preferred_field_groups:
        - LINE_NARROWING
        - ORDER_ANCHOR
      preferred_fields:
        - product_sku
        - product_description
        - order_number
        - invoice_number
    DISAMBIGUATE_MULTIPLE_ORDERS:
      preferred_field_groups:
        - ORDER_ANCHOR
        - DATE_NARROWING
        - LINE_NARROWING
      preferred_fields:
        - order_number
        - invoice_number
        - customer_po_number
        - approximate_purchase_date
        - product_sku
        - product_description
    IDENTIFY_SOURCE_CHANNEL:
      preferred_field_groups:
        - ORDER_ANCHOR
        - SOURCE_NARROWING
        - CUSTOMER_ANCHOR
      preferred_fields:
        - order_number
        - purchase_channel_hint
        - email
        - phone
    CAPTURE_RETURN_CONTEXT:
      preferred_field_groups:
        - RETURN_CONTEXT
      preferred_fields:
        - return_reason
        - product_presence

return_policy:
  photo_required_reason_codes:
    - DAMAGED
    - DEFECTIVE
    - WRONG_ITEM
  supported_product_presence:
    - PRESENT_AT_BRANCH
    - OFFSITE_CUSTOMER_RESIDENCE
    - OFFSITE_CUSTOMER_JOBSITE
    - OFFSITE_COMMERCIAL_SITE
    - OFFSITE_VENDOR_SITE
    - OFFSITE_OTHER
    - NOT_APPLICABLE
  normalized_return_methods:
    - PREPAID_PARCEL
    - BRANCH_UPS
    - BRANCH_LTL
    - OFFSITE_PARCEL
    - OFFSITE_LTL
    - DIRECT_VENDOR
    - FIELD_SCRAP
    - NO_PHYSICAL_RETURN
    - CUSTOMER_KEEP
    - UNKNOWN
  rga_required_product_resolutions:
    - RTV
  heavy_pickup_required_fields:
    - address
    - contact_name
    - contact_phone
    - handling_unit_count
    - estimated_weight
    - dimensions
    - palletized
    - available_windows
  branch_staging:
    require_return_number_tag: true
    allow_manufacturer_box_marking: false
    allow_branch_inventory_addition: false

workflow:
  version: "2.0"
  stages:
    - INTAKE
    - ORDER_DISCOVERY
    - ORDER_CONFIRMATION
    - RETURN_DETAILS
    - SUPPORT_REQUEST
    - RETURN_CREATION
    - PHYSICAL_RETURN_SETUP
    - RETURN_SHIPMENT
    - RECEIPT
    - CUSTOMER_RESOLUTION
    - PRODUCT_DISPOSITION
    - WAREHOUSE_PROCESSING
    - CUSTOMER_RETURN_COMPLETE
    - VENDOR_RECOVERY
    - FULLY_CLOSED
  sla_minutes:
    support_acknowledgement: 5
    support_clarification: 30
    return_creation: 1440
    shipping_instructions: 7200
    pickup_scheduling: 2880
  completion_dimensions:
    - customer_resolution_complete
    - physical_return_complete
    - warehouse_processing_complete
    - vendor_recovery_complete
    - case_fully_closed

support:
  authority_mode: INTERNAL_PLATFORM
  external_mirror_enabled: false
  default_priority: NORMAL
  queues:
    - RETURNS_SUPPORT
    - LOGISTICS
    - WAREHOUSE_EXCEPTION
    - OMC_EXCEPTION
  external_ticket_outbox_topic: return-support.ticket.create

omc:
  v2_customer_return_table: omc.returns.returnMerchandiseAuthorization
  v1_customer_return_table: omc.dbo.returns
  customer_return_display:
    V2: "RMA {id}"
    V1: "Return {id}"
  normalized_statuses:
    REQUESTED: IN_PROGRESS
    ENTERED: IN_PROGRESS
    ISSUED: IN_PROGRESS
    PROCESSED: PHYSICAL_COMPLETE
    CREDITED: CUSTOMER_RESOLUTION_COMPLETE
    REFUNDED: CUSTOMER_RESOLUTION_COMPLETE
    DENIED: REJECTED
    CANCELLED: CANCELLED
  tendered_is_pickup: false
  license_plate_implies_receipt: true
  rga_is_customer_return: false

bay:
  authority_mode: PROJECTION
  require_physical_receipt: true
  allow_prearrival_reservation: false
  eligible_statuses:
    - WAREHOUSE_RECEIVED
    - INSPECTION_COMPLETE


integrations:
  omc_return_create:
    enabled: true
    topic: omc.return.create
    authority: OMC
    ai_may_fabricate_success: false
  external_support_mirror:
    enabled: false
    topic: return-support.ticket.create
    authority: EXTERNAL_TICKET_SYSTEM
    ai_may_fabricate_success: false
  carrier_booking:
    enabled: true
    topic: carrier.return.book
    authority: CARRIER_OR_TMS
    ai_may_fabricate_success: false
  customer_notification:
    enabled: true
    topic: customer.return.notify
    authority: NOTIFICATION_PROVIDER
    ai_may_fabricate_success: false

extensions:
  document_artifact_metadata: true
  ocr_processing: false
  image_processing: false
  ncr_workflow: false
  vendor_recovery_workflow: true

feature_flags:
  reusable_conversation_engine: true
  order_discovery_copilot: true
  copilot_operations_console: false
  graph_first_runtime_configuration: true

runtime_integrations:
  ai_providers: []
  data_sources:
    - source_key: platform-mongodb
      source_type: MONGODB
      enabled: true
      access_mode: READ_WRITE
      uri: mongodb://runtime-resolved.invalid/return_platform
      database: return_platform
      bootstrap_managed: true
      credential:
        profile_key: platform-mongodb-runtime
        vault_reference: vault://secret/production/data-sources/mongodb#dsn
        bootstrap_managed: true
      required_datasets:
        - associate_conversations
        - discovery_locks
    - source_key: source-mongodb
      source_type: MONGODB
      enabled: true
      access_mode: READ_ONLY
      uri: mongodb://runtime-resolved.invalid/return_source
      database: return_source
      bootstrap_managed: true
      credential:
        profile_key: source-mongodb-runtime
        vault_reference: vault://secret/production/data-sources/mongodb#source_dsn
        bootstrap_managed: true
      required_datasets:
        - customers
        - salesInv
        - products
    - source_key: configuration-neo4j
      source_type: NEO4J
      enabled: true
      access_mode: READ_WRITE
      uri: bolt://runtime-resolved.invalid:7687
      username: neo4j
      database: neo4j
      bootstrap_managed: true
      credential:
        profile_key: neo4j-runtime
        vault_reference: vault://secret/production/data-sources/neo4j#password
        bootstrap_managed: true
      required_datasets:
        - customer_name_search_v2
        - product_description_search_v2
    - source_key: omc-sqlserver
      source_type: SQLSERVER
      enabled: true
      access_mode: READ_ONLY
      host: runtime-resolved.invalid
      port: 1433
      username: sa
      database: return_platform
      bootstrap_managed: true
      credential:
        profile_key: omc-sqlserver-runtime
        vault_reference: vault://secret/production/data-sources/sqlserver#password
        bootstrap_managed: true
    - source_key: valkey
      source_type: VALKEY
      enabled: true
      access_mode: READ_WRITE
      host: runtime-resolved.invalid
      port: 6379
      bootstrap_managed: true
      credential:
        profile_key: valkey-runtime
        vault_reference: vault://secret/production/data-sources/valkey#password
        bootstrap_managed: true
    - source_key: temporal
      source_type: TEMPORAL
      enabled: true
      access_mode: READ_WRITE
      host: runtime-resolved.invalid
      port: 7233
      bootstrap_managed: true
