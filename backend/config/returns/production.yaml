  goals:
    IDENTIFY_ORDER:
      preferred_field_groups:
        - ORDER_ANCHOR
        - SHIPMENT_ANCHOR
        - CUSTOMER_ANCHOR
        - DATE_NARROWING
      preferred_fields:
