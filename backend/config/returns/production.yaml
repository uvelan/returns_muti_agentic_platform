return_policy:
  photo_required_reason_codes:
    - DAMAGED
    - DEFECTIVE
    - WRONG_ITEM
  supported_product_presence:
    - PRESENT_AT_BRANCH
    - OFFSITE_CUSTOMER_RESIDENCE
    - OFFSITE_CUSTOMER_JOBSITE
    - OFFSITE_COMMERCIAL_SITE
    - OFFSITE_VENDOR_SITE
    - OFFSITE_OTHER
    - NOT_APPLICABLE
  # How the parcel-vs-freight class is decided from the product, so Support is
  # told the method rather than asked for it.
  #
  # `_derive_return_method` has always been able to do this -- "the
  # parcel-vs-freight class, from what the product is, never asked" -- and has
  # always answered `None` here, because this block did not exist. So every
  # handoff went out with no method, every case sat on `awaiting:
  # ["RETURN_METHOD"]`, and the Support agent's first message on every thread
  # was "Before the RMA can be issued, please confirm: return method."
  #
  # One freight-class line decides the whole shipment: the parcel network cannot
  # carry it, so a consignment holding a water heater and a box of fittings goes
  # LTL entire. The keywords are matched against the resolved product
  # description and SKU, upper-cased.
  #
  # Derived, not decided. The answer is recorded as a `return_method` fact with
  # `DERIVED` acquisition and travels to Support with that provenance, and
  # Support remains free to record a different one on the outcome -- which
  # supersedes it, as a stated value should.
  return_method_derivation:
    default_method: PREPAID_PARCEL
    freight_method: BRANCH_LTL
    # Observed codes in this corpus: CPU counter pick-up (56%), WCL will-call,
    # OT our truck, XPW express parcel, M mail.
    #
    # CPU and WCL are inferred rows and want operator review, in the sense the
    # requirements table already uses: a customer who collected at the counter
    # can carry it back to the counter, and `BRANCH_UPS` is this catalogue's
    # nearest entry for the branch handling the return leg -- but whether that
    # is what the desk means by it is a business answer, not a reading.
    ship_via_methods:
      CPU: BRANCH_UPS
      WCL: BRANCH_UPS
      OT: BRANCH_LTL
      XPW: PREPAID_PARCEL
      M: PREPAID_PARCEL
    freight_keywords:
      # Water heaters, tanks and boilers -- the commonest LTL class in this
      # catalogue and the one an associate is most likely to meet.
      - WHTR
      - WATER HEATER
      - TKLS
      - TANK
      - BOILER
      - FURN
      # Bath and fixture ware that ships crated.
      - TUB
      - SHOWER BASE
      - TOILET
      - LAVATORY
      - SINK
      # Mechanical plant.
      - CONDENSER
      - AIR HANDLER
      - PUMP
      - COMPRESSOR
      # Length, which is what puts pipe and duct on a truck regardless of weight.
      - PIPE
      - DUCT
  normalized_return_methods:
    - PREPAID_PARCEL
    - BRANCH_UPS
    - BRANCH_LTL
    - OFFSITE_PARCEL
    - OFFSITE_LTL
    - DIRECT_VENDOR
    - FIELD_SCRAP
    - NO_PHYSICAL_RETURN
    - CUSTOMER_KEEP
    - UNKNOWN
  # What each return method needs before the return is business-complete.
  # `awaiting[]` is `required(method) - satisfied(case)` and `businessComplete`
  # is that difference being empty, so this table is the whole definition of
  # "done" for a return -- it sits beside the catalogue above because adding a
  # method without saying what it requires is an incomplete release.
  #
  # Three structural rules, enforced at load rather than described here:
  #   * every row must require RMA -- a method that completes without an
  #     authorization completes without a return;
  #   * no row may name UNKNOWN -- UNKNOWN is the absence of a method, and a row
  #     for it would let an undecided case complete;
  #   * a method with NO row is unmapped, which leaves the completion profile
  #     unresolved and the case awaiting RETURN_METHOD. That is the safe
  #     direction and the reason an empty `requires` list is rejected: "no row"
  #     must never read as "requires nothing".
  #
  # Dimensions: RMA, LABEL, TRACKING, BOL, PICKUP, RETURN_LOCATION.
  return_method_requirements:
    # --- Stated verbatim in the remediation plan (sect. 6.4).
    - method: PREPAID_PARCEL
      requires: [RMA, LABEL, TRACKING]
    - method: BRANCH_LTL
      requires: [RMA, BOL, PICKUP]
    - method: OFFSITE_LTL
      requires: [RMA, BOL, PICKUP, RETURN_LOCATION]
    - method: CUSTOMER_KEEP
      requires: [RMA]
    - method: NO_PHYSICAL_RETURN
      requires: [RMA]
    # --- INFERRED FROM THE CATALOGUE -- OPERATOR REVIEW REQUIRED.
    #     The four rows below were derived when the table moved out of code.
    #     The plan does not state them, so each is a reading rather than a
    #     decision, and each is wrong in a way that shows up late: too few
    #     requirements lets a return report itself complete without the
    #     paperwork, too many hangs it forever on an artifact nobody produces.
    #     Confirm each with Returns operations and delete this banner.
    #
    #     A parcel tendered at a branch: the branch is the origin, so there is
    #     no return location to establish, but there is still a label to print
    #     and a number to follow.
    - method: BRANCH_UPS
      requires: [RMA, LABEL, TRACKING]
    #     A parcel from a customer site -- BRANCH_UPS plus the location, for the
    #     same reason OFFSITE_LTL is BRANCH_LTL plus one.
    - method: OFFSITE_PARCEL
      requires: [RMA, LABEL, TRACKING, RETURN_LOCATION]
    #     Straight back to the vendor. Somebody has to say where; the carrier
    #     paperwork is the vendor's, not ours.
    - method: DIRECT_VENDOR
      requires: [RMA, RETURN_LOCATION]
    #     Scrapped where it stands. Nothing ships, so nothing but the
    #     authorization can be required -- the same shape as NO_PHYSICAL_RETURN,
    #     reached for a different reason.
    - method: FIELD_SCRAP
      requires: [RMA]
    # --- UNKNOWN has no row, and cannot have one. See the second rule above.
  # Which shipping instruction types tender a bill of lading. Recording
  # shipping instructions of one of these types emits BOL_TENDERED alongside
  # SHIPPING_INSTRUCTIONS_ISSUED, and the same set decides what the acting role
  # has to be authorized for -- the check and the act read one list.
  #
  # Carries both the instruction-type vocabulary Support uses (LTL, BOL,
  # HEAVY_TRUCK_PICKUP) and the normalized return methods above that are
  # freight (BRANCH_LTL, OFFSITE_LTL), because `shippingInstructionType` is
  # populated from either.
  bol_tendering_instruction_types:
    - LTL
    - BOL
    - BRANCH_LTL
    - OFFSITE_LTL
    - HEAVY_TRUCK_PICKUP
  rga_required_product_resolutions:
    - RTV
  heavy_pickup_required_fields:
    - address
    - contact_name
    - contact_phone
    - handling_unit_count
    - estimated_weight
    - dimensions
    - palletized
    - available_windows
  branch_staging:
    require_return_number_tag: true
    allow_manufacturer_box_marking: false
    allow_branch_inventory_addition: false

# What an associate may say about a line they are selecting (plan sect. 12.4).
#
# Top-level rather than nested inside `return_policy` on purpose. The publisher
# merges this file underneath the active release one TOP-LEVEL key at a time, so
# a key added inside `return_policy` would be dropped by the release's own
# `return_policy` and could never reach a deployment that has ever published
# (defect D11, observed with `copilot.order_discovery_agent_id`). A new
# top-level key is in no existing release, so this one arrives on the next
# publish.
#
# An empty list here means "no catalogue published", which leaves the field as
# length-bounded free text -- the behaviour before this block existed. It does
# not mean "reject everything": that would take a branch's returns offline over
# a key nobody had been asked for.
selection_vocabulary:
  # Constrained at load to `policy.vocabulary.ReturnReason`, the evaluator's own
  # closed vocabulary. A reason outside it resolves to UNKNOWN in
  # `case_policy_facts` and routes the return to a human with nothing in the
  # audit trail saying why, so the release is refused instead.
  #
  # UNKNOWN is absent and cannot be listed: it is the absence of an answer, not
  # something an associate chooses.
  reasons:
    # Delivery-related. The same four `return_eligibility_policy.delivery_claim`
    # already routes as a claim.
    - SHIPPING_DAMAGE
    - SHORTAGE
    - SHIPMENT_ERROR
    - IMPROPER_DELIVERY
    # Warranty-related. The same four `return_eligibility_policy.warranty_issue`
    # already routes to warranty verification.
    - MANUFACTURING_DEFECT
    - PRODUCT_FAILURE_AFTER_INSTALLATION
    - COVERED_PRIVATE_LABEL_DEFECT
    - MANUFACTURER_WARRANTY_ISSUE
    # Ordinary returns. These take the standard-stock path.
    - CHANGED_MIND
    - ORDERED_IN_ERROR
    - NO_LONGER_NEEDED
    - OTHER
  # --- DERIVED FROM THE ELIGIBILITY POLICY -- OPERATOR REVIEW REQUIRED.
  #     There is no condition vocabulary anywhere in code to copy, and inventing
  #     one in Python is the defect this block removes. Every entry below is
  #     instead the associate-facing name of a condition
  #     `return_eligibility_policy.standard_stock_return.requirements` already
  #     reads: the five `condition` facts and the eight `prohibited_states`.
  #     They are a reading of that table, not a decision Returns operations has
  #     taken. Confirm the wording with the counter staff who will pick from it
  #     and delete this banner.
  #
  #     Deleting an entry is safe -- an associate can no longer choose it.
  #     Adding one is safe too: nothing downstream branches on a condition, so
  #     the value is recorded and read by a human.
  conditions:
    # Satisfies the resale requirements: new, suitable for resale, original
    # packaging, packaging undamaged, all original parts.
    - NEW_IN_ORIGINAL_PACKAGING
    # New, but the packaging no longer proves it.
    - NEW_PACKAGING_OPENED
    - NEW_PACKAGING_DAMAGED
    - MISSING_ORIGINAL_PARTS
    # The eight prohibited states, one entry each, so an associate naming the
    # state names the one the policy refuses on.
    - USED
    - INSTALLED
    - MODIFIED
    - REBUILT
    - RECONDITIONED
    - REPAIRED
    - ALTERED
    - DAMAGED

workflow:
  version: "2.0"
  stages:
    - INTAKE
    - ORDER_DISCOVERY
    - ORDER_CONFIRMATION
    - RETURN_DETAILS
    - SUPPORT_REQUEST
    - RETURN_CREATION
    - PHYSICAL_RETURN_SETUP
    - RETURN_SHIPMENT
    - RECEIPT
    - CUSTOMER_RESOLUTION
    - PRODUCT_DISPOSITION
    - WAREHOUSE_PROCESSING
    - CUSTOMER_RETURN_COMPLETE
    - VENDOR_RECOVERY
    - FULLY_CLOSED
  sla_minutes:
    support_acknowledgement: 5
    support_clarification: 30
    return_creation: 1440
    shipping_instructions: 7200
    pickup_scheduling: 2880
  completion_dimensions:
    - customer_resolution_complete
    - physical_return_complete
    - warehouse_processing_complete
    - vendor_recovery_complete
    - case_fully_closed

support:
  authority_mode: INTERNAL_PLATFORM
  external_mirror_enabled: false
  default_priority: NORMAL
  queues:
    - RETURNS_SUPPORT
    - LOGISTICS
    - WAREHOUSE_EXCEPTION
    - OMC_EXCEPTION
  external_ticket_outbox_topic: return-support.ticket.create

omc:
  v2_customer_return_table: omc.returns.returnMerchandiseAuthorization
  v1_customer_return_table: omc.dbo.returns
  customer_return_display:
    V2: "RMA {id}"
    V1: "Return {id}"
  normalized_statuses:
    REQUESTED: IN_PROGRESS
    ENTERED: IN_PROGRESS
    ISSUED: IN_PROGRESS
    PROCESSED: PHYSICAL_COMPLETE
    CREDITED: CUSTOMER_RESOLUTION_COMPLETE
    REFUNDED: CUSTOMER_RESOLUTION_COMPLETE
    DENIED: REJECTED
    CANCELLED: CANCELLED
  tendered_is_pickup: false
  license_plate_implies_receipt: true
  rga_is_customer_return: false

bay:
  authority_mode: PROJECTION
  require_physical_receipt: true
  allow_prearrival_reservation: false
  eligible_statuses:
    - WAREHOUSE_RECEIVED
    - INSPECTION_COMPLETE

# How long a case waits and how often it chases. Every value is editable
# through a configuration release; a running workflow keeps the values it
# started with, so changes apply to new cases rather than moving a deadline
# under a return already waiting on it.
return_case:
  # Bay is advisory and sits in front of every return, so this is dead time on
  # the critical path before the Support handoff can begin. Deliberately short.
  bay_wait_seconds: 120
  # A Support request nobody has described is a task a human cannot act on.
  #
  # The default is false, which opens the thread the moment the case is cleared
  # and lets the detail follow -- and what Support received was a request whose
  # own verification block read "Required Return Information: Incomplete", with
  # no reason, no quantity and no condition, while the associate was still being
  # asked for them in the chat. The first thing the human does with that is come
  # back and ask.
  #
  # Turning it on is an operator's decision, which is why it defaults off, and
  # this deployment is making it: wait for the description, and park rather than
  # hand over a return nobody finished describing. The wait is satisfied by any
  # surface that records a detail -- the item pane, the conversation, an
  # operator -- and the case is asked directly, so answering the agent's
  # question in chat counts.
  return_details_required: true
  # The same thirty minutes as the reservation hold above, and for the same
  # reason: they bound one live counter conversation from two directions, and a
  # selection whose hold has expired is a selection the associate is no longer
  # making.
  return_details_wait_seconds: 1800
  # How long a selected line's quantity is held for this case before the hold
  # expires and the units go back to everyone else (plan sect. 12.3). Wall
  # clock, not business hours: it bounds a live counter conversation, and a
  # hold that survived a weekend would make Monday's associate wait for
  # Friday's abandoned one. Thirty minutes.
  item_reservation_ttl_seconds: 1800
  # Business hours, not wall clock -- eight hours over a weekend is a different
  # instant entirely. `business_calendar_id` names the calendar that decides.
  #
  # DEV SETTING (2026-08-15, operator decision: "change to ttl seconds in dev").
  # Set equal to `item_reservation_ttl_seconds` above, to close the overselling
  # window described in D46: the availability formula counts only ACTIVE holds
  # and RMA-covered items, so between a hold lapsing and Support answering the
  # units belonged to neither and a second case could be authorized for them.
  # At 28800 against a 30-minute hold that window was hours, and up to ~72
  # wall-clock hours across a weekend.
  #
  # This value alone is NOT sufficient -- it is measured on the business
  # calendar while the TTL is wall clock, so outside 09:00-17:00 it would still
  # stretch. `business_calendars.default` is therefore ALSO set to 24/7 below,
  # which the calendar's own documentation names as the way to get wall-clock
  # behaviour back exactly. The two changes only work together.
  #
  # BEFORE LIVE: restore 28800 (or the desk's real SLA) and restore the real
  # Mon-Fri calendar. A 30-minute Support SLA is not a real-world commitment;
  # the production answer to D46 is a fourth term in the availability formula
  # for "selected but not yet authorized", not a shortened SLA.
  support_response_wait_seconds: 1800
  reminder_interval_seconds: 7200
  max_reminders: 3
  # A reminder cap with no terminal branch leaves the case sitting forever with
  # nobody told.
  on_reminders_exhausted: PARK_FOR_OPERATIONS
  business_calendar_id: default
  timezone: UTC

# When the support desk is open. Declared, never assumed: there is no Mon-Fri
# anywhere in the code that reads this, so a deployment whose desk works
# Saturdays adds a Saturday period and gets one, and a 24/7 operation declares
# every day 0..1440 and gets wall-clock behaviour back exactly.
#
# `weekday` is Monday-0. `end_minute` is exclusive, so 1020 is 17:00 and 1440
# is midnight at the end of the day.
business_calendars:
  - calendar_id: default
    # The desk's own zone. `return_case.timezone` is only a fallback for a
    # calendar that declares none -- a holiday has to fall on the same day for
    # every reader whatever zone the worker computing it runs in.
    timezone: America/New_York
    # DEV SETTING (2026-08-15) -- 24/7, i.e. every day 0..1440. This is the
    # mechanism this file's own header names: "a 24/7 operation declares every
    # day 0..1440 and gets wall-clock behaviour back exactly."
    #
    # It exists to make `support_response_wait_seconds: 1800` mean thirty
    # *wall-clock* minutes, matching `item_reservation_ttl_seconds`. Without it
    # the two clocks disagree and D46's overselling window reopens outside
    # office hours -- which, for a dev stack worked on at any hour, is most of
    # the time.
    #
    # Blast radius, stated rather than discovered later: every deadline and
    # reminder computed on this calendar becomes wall clock too. In dev that is
    # the point -- nothing should sit until Monday.
    #
    # BEFORE LIVE: restore the Mon-Fri 540..1020 pattern below, together with
    # `support_response_wait_seconds: 28800`.
    working_periods:
      - { weekday: 0, start_minute: 0, end_minute: 1440 }
      - { weekday: 1, start_minute: 0, end_minute: 1440 }
      - { weekday: 2, start_minute: 0, end_minute: 1440 }
      - { weekday: 3, start_minute: 0, end_minute: 1440 }
      - { weekday: 4, start_minute: 0, end_minute: 1440 }
      - { weekday: 5, start_minute: 0, end_minute: 1440 }
      - { weekday: 6, start_minute: 0, end_minute: 1440 }
    # The real Mon-Fri desk, kept here so restoring it is a copy rather than a
    # reconstruction:
    #   - { weekday: 0, start_minute: 540, end_minute: 1020 }
    #   - { weekday: 1, start_minute: 540, end_minute: 1020 }
    #   - { weekday: 2, start_minute: 540, end_minute: 1020 }
    #   - { weekday: 3, start_minute: 540, end_minute: 1020 }
    #   - { weekday: 4, start_minute: 540, end_minute: 1020 }
    #
    # Whole non-working days in the calendar's own zone. Extend per year; an
    # empty list is legitimate and means the weekly pattern is the whole story.
    # Emptied in dev for the same reason: a holiday is a day nothing progresses.
    holidays: []
    # The real holiday list, for restoration:
    #   2026-01-01, 2026-07-03, 2026-11-26, 2026-11-27, 2026-12-25


integrations:
  omc_return_create:
    enabled: true
    topic: omc.return.create
    authority: OMC
    ai_may_fabricate_success: false
  external_support_mirror:
    enabled: false
    topic: return-support.ticket.create
    authority: EXTERNAL_TICKET_SYSTEM
    ai_may_fabricate_success: false
  carrier_booking:
    enabled: true
    topic: carrier.return.book
    authority: CARRIER_OR_TMS
    ai_may_fabricate_success: false
  customer_notification:
    enabled: true
    topic: customer.return.notify
    authority: NOTIFICATION_PROVIDER
    ai_may_fabricate_success: false

extensions:
  document_artifact_metadata: true
  ocr_processing: false
  image_processing: false
  ncr_workflow: false
  vendor_recovery_workflow: true

feature_flags:
  reusable_conversation_engine: true
  order_discovery_copilot: true
  copilot_operations_console: false
  graph_first_runtime_configuration: true

# The deterministic eligibility gate. Suspended here, in the file, rather than
# only on a published release: an operator's disable lives in the graph
# configuration and does not survive a reset, so the gate came back on by itself
# the moment the release was rebuilt from this file -- which is how a walkthrough
# case ended up routed to REVIEW_REQUIRED on OUTSIDE_STANDARD_RETURN_WINDOW.
#
# Disabling is not an approval and is never read as one: the case records
# `policy_evaluation_state = SKIPPED_BY_CONFIGURATION` and the reason below, with
# no route and no decision, so "no rule was applied" stays distinguishable from
# "a rule approved this". Publishing a policy is unaffected --
# `return_eligibility_policy` below still has to be a valid rule set, because a
# deployment must be able to switch the gate back on without cutting a release.
policy_evaluation:
  enabled: false
  disabled_reason: >-
    Suspended on this development host while order-discovery turns are answered
    through the MANUAL provider. Re-enable before any case that is not a
    walkthrough.

context_assembly:
  # How a case's facts become the context a model reasons over (contracts.md
  # sect. 10). Every value here is the code default, restated: the block is
  # written out so a deployment changing one is editing configuration rather
  # than discovering that the knob exists.
  #
  # Names that are always in the assembled context, whatever the budget says.
  # Empty by default: a name pinned here that no case writes would be a
  # reservation against a fact that never arrives, and the pins that matter are
  # the ones a consumer adds when it knows what it is reasoning about.
  pinned_fact_names: []
  # The ceiling, measured by `tokenizer_version` below.
  token_budget: 8000
  # Pinned with promptVersion. `assemble_case_context` refuses a version it
  # cannot measure rather than falling back to another estimator -- a silent
  # fallback is the one outcome a pin exists to rule out.
  tokenizer_version: wordpiece-approx.v1
  compaction:
    # Ask for a summary at four fifths of the budget, leaving the last fifth as
    # headroom for the next few facts before anything has to be left out.
    trigger_fraction_millionths: 800000
    summary_task_id: support.context.summarize.v1

support_ingress:
  # What the platform accepts from Support and how it answers back
  # (contracts.md sect. 5). Every value here is the code default restated, so
  # a deployment changing one is editing configuration rather than discovering
  # that the knob exists.
  #
  # The natural-language door starts shut. The structured
  # `.../return-outcome` path is unaffected by this switch and is always on
  # (DR-2): this gates only the free-text endpoint. Messages that arrive while
  # it is false are persisted PARKED and reprocessed in stream order when it
  # is flipped -- never refused -- so shipping it shut costs no message.
  nl_enabled: false
  # The closed classification taxonomy (contracts.md sect. 5). Widening this
  # list widens what is *recognised*; it cannot widen what is executed,
  # because anything outside the set becomes `other` in code.
  intents:
    - info_request
    - rma_issued
    - label_issued
    - shipping_instruction
    - tracking_provided
    - partial_fulfillment
    - rejection
    - acknowledgement
    - other
  parking:
    # A month. Long enough that flipping the switch after a quiet period still
    # finds the traffic that arrived during it.
    retention_seconds: 2592000
    # A case holding this many parked messages is not a case with a backlog;
    # it is a case nobody is reading, and it escalates.
    per_case_quota: 50
    # One alert per case per quarter hour. A disabled switch with live traffic
    # behind it would otherwise page in proportion to the traffic.
    alert_dedupe_window_seconds: 900
  # The prompt section carrying the do-not-mix framing for a message that fans
  # out to several return records. The key, not the text: the wording lives
  # with the other prompt text and this names which of it applies.
  multi_record_framing_prompt_key: support-multi-record-do-not-mix
  agent_disclosure:
    # Carried on every agent-authored Channel B message (contracts.md sect. 9),
    # both through the shared prompt-section anchor on the `support.*` tasks
    # and through the templated sends.
    display_name: Returns Assistant
    disclosure_line: >-
      This message was written by the Returns Assistant, an automated agent working on this
      return case. A branch associate reviews and can answer anything it cannot.
  # Outbound Channel B text by template id, under sect. 8's interpolation-only
  # grammar. Empty by default: the templates that matter are the ones a
  # deployment writes for its own voice, and a model composes only where a
  # deployment has configured it to.
  outbound_templates: {}
  limits:
    # Refused with 413 rather than truncated: the cut half of a truncated
    # support message may be the tracking number.
    max_body_characters: 16000
    # Per case rather than per principal -- the resource being protected is
    # the case's analysis pipeline, and one transport speaking for many
    # principals is the ordinary shape.
    max_messages_per_case_per_window: 60
    rate_window_seconds: 60
    max_identifier_characters: 256

support_resolver:
  # How the platform answers a question Support asked (contracts.md sect. 9).
  # Every value here is the code default restated, so a deployment changing one
  # is editing configuration rather than discovering that the knob exists.
  #
  # Both thresholds are millionths, matching the gateway's
  # `confidenceMillionths` envelope so the released number and the measured
  # number are the same unit with no conversion between them. They are high on
  # purpose: the failure this slice must not have is a confident-sounding wrong
  # answer sent to Support under the platform's own name. Below the threshold
  # the ladder does not try harder with the same evidence -- it descends a rung,
  # and escalates to an associate when the rungs run out.
  fact_confidence_millionths: 900000
  graph_confidence_millionths: 900000
  # Which capabilities a validated intent makes eligible. Empty means **no tool
  # is eligible for any intent** and the ladder's tool rung refuses every time.
  # That is the closed default the tool boundary implies: a tool a deployment
  # has not bound is a tool that cannot run, and binding one is precisely what
  # sect. 9 calls a config-only tool addition. A binding names a `tool_id`, the
  # `intents` it serves, a `capability` and `contract` published in the
  # CapabilityRegistry, an `input_schema_ref` from the code-side allowlist in
  # platform/capabilities/tool_schemas.py, and a `credential_binding_id` naming
  # a CredentialBindingConfiguration profile key. Every field is a reference;
  # none is a value, an expression or a template.
  tool_bindings: []
  reply_gate:
    # Review required for every intent, including ones a later release adds to
    # the taxonomy: `default` is the floor and `per_intent` is the exception
    # list, stated that way round because the safe value is the one that applies
    # to intents nobody thought about. `auto_reply` is a per-intent opt-in and
    # is never a global.
    default: review_required
    per_intent: {}
  # An answered clarification pushes the review deadline out again. True,
  # because the associate answered promptly and the clock they were racing was
  # started by a question the platform asked *them*. The reset never moves a
  # deadline inwards.
  clarification_resets_deadline: true
  # Model invocations one case may spend on resolution, across all its support
  # questions. Exhaustion is not a silent stop: it writes
  # `support_resolver_budget_exhausted` and escalates, so a case that outruns
  # its budget becomes visible work rather than an unanswered message.
  per_case_llm_budget: 12

copilot:
  # The agent policy every Copilot conversation turn is routed to. It must name
  # a key under `agent_policies` in the active schema release
  # (config/dynamic_knowledge/active-schema.return-order.yaml); a dangling value
  # is a hard error, not a fallback, because the alternative is the 422 that
  # this setting exists to remove.
  order_discovery_agent_id: order-discovery-agent

