return_policy:
  photo_required_reason_codes:
    - DAMAGED
    - DEFECTIVE
    - WRONG_ITEM
  supported_product_presence:
    - PRESENT_AT_BRANCH
    - OFFSITE_CUSTOMER_RESIDENCE
    - OFFSITE_CUSTOMER_JOBSITE
    - OFFSITE_COMMERCIAL_SITE
    - OFFSITE_VENDOR_SITE
    - OFFSITE_OTHER
    - NOT_APPLICABLE
  normalized_return_methods:
    - PREPAID_PARCEL
    - BRANCH_UPS
    - BRANCH_LTL
    - OFFSITE_PARCEL
    - OFFSITE_LTL
    - DIRECT_VENDOR
    - FIELD_SCRAP
    - NO_PHYSICAL_RETURN
    - CUSTOMER_KEEP
    - UNKNOWN
  # Which shipping instruction types tender a bill of lading. Recording
  # shipping instructions of one of these types emits BOL_TENDERED alongside
  # SHIPPING_INSTRUCTIONS_ISSUED, and the same set decides what the acting role
  # has to be authorized for -- the check and the act read one list.
  #
  # Carries both the instruction-type vocabulary Support uses (LTL, BOL,
  # HEAVY_TRUCK_PICKUP) and the normalized return methods above that are
  # freight (BRANCH_LTL, OFFSITE_LTL), because `shippingInstructionType` is
  # populated from either.
  bol_tendering_instruction_types:
    - LTL
    - BOL
    - BRANCH_LTL
    - OFFSITE_LTL
    - HEAVY_TRUCK_PICKUP
  rga_required_product_resolutions:
    - RTV
  heavy_pickup_required_fields:
    - address
    - contact_name
    - contact_phone
    - handling_unit_count
    - estimated_weight
    - dimensions
    - palletized
    - available_windows
  branch_staging:
    require_return_number_tag: true
    allow_manufacturer_box_marking: false
    allow_branch_inventory_addition: false

workflow:
  version: "2.0"
  stages:
    - INTAKE
    - ORDER_DISCOVERY
    - ORDER_CONFIRMATION
    - RETURN_DETAILS
    - SUPPORT_REQUEST
    - RETURN_CREATION
    - PHYSICAL_RETURN_SETUP
    - RETURN_SHIPMENT
    - RECEIPT
    - CUSTOMER_RESOLUTION
    - PRODUCT_DISPOSITION
    - WAREHOUSE_PROCESSING
    - CUSTOMER_RETURN_COMPLETE
    - VENDOR_RECOVERY
    - FULLY_CLOSED
  sla_minutes:
    support_acknowledgement: 5
    support_clarification: 30
    return_creation: 1440
    shipping_instructions: 7200
    pickup_scheduling: 2880
  completion_dimensions:
    - customer_resolution_complete
    - physical_return_complete
    - warehouse_processing_complete
    - vendor_recovery_complete
    - case_fully_closed

support:
  authority_mode: INTERNAL_PLATFORM
  external_mirror_enabled: false
  default_priority: NORMAL
  queues:
    - RETURNS_SUPPORT
    - LOGISTICS
    - WAREHOUSE_EXCEPTION
    - OMC_EXCEPTION
  external_ticket_outbox_topic: return-support.ticket.create

omc:
  v2_customer_return_table: omc.returns.returnMerchandiseAuthorization
  v1_customer_return_table: omc.dbo.returns
  customer_return_display:
    V2: "RMA {id}"
    V1: "Return {id}"
  normalized_statuses:
    REQUESTED: IN_PROGRESS
    ENTERED: IN_PROGRESS
    ISSUED: IN_PROGRESS
    PROCESSED: PHYSICAL_COMPLETE
    CREDITED: CUSTOMER_RESOLUTION_COMPLETE
    REFUNDED: CUSTOMER_RESOLUTION_COMPLETE
    DENIED: REJECTED
    CANCELLED: CANCELLED
  tendered_is_pickup: false
  license_plate_implies_receipt: true
  rga_is_customer_return: false

bay:
  authority_mode: PROJECTION
  require_physical_receipt: true
  allow_prearrival_reservation: false
  eligible_statuses:
    - WAREHOUSE_RECEIVED
    - INSPECTION_COMPLETE

# How long a case waits and how often it chases. Every value is editable
# through a configuration release; a running workflow keeps the values it
# started with, so changes apply to new cases rather than moving a deadline
# under a return already waiting on it.
return_case:
  # Bay is advisory and sits in front of every return, so this is dead time on
  # the critical path before the Support handoff can begin. Deliberately short.
  bay_wait_seconds: 120
  # Business hours, not wall clock -- eight hours over a weekend is a different
  # instant entirely. `business_calendar_id` names the calendar that decides.
  support_response_wait_seconds: 28800
  reminder_interval_seconds: 7200
  max_reminders: 3
  # A reminder cap with no terminal branch leaves the case sitting forever with
  # nobody told.
  on_reminders_exhausted: PARK_FOR_OPERATIONS
  business_calendar_id: default
  timezone: UTC

# When the support desk is open. Declared, never assumed: there is no Mon-Fri
# anywhere in the code that reads this, so a deployment whose desk works
# Saturdays adds a Saturday period and gets one, and a 24/7 operation declares
# every day 0..1440 and gets wall-clock behaviour back exactly.
#
# `weekday` is Monday-0. `end_minute` is exclusive, so 1020 is 17:00 and 1440
# is midnight at the end of the day.
business_calendars:
  - calendar_id: default
    # The desk's own zone. `return_case.timezone` is only a fallback for a
    # calendar that declares none -- a holiday has to fall on the same day for
    # every reader whatever zone the worker computing it runs in.
    timezone: America/New_York
    working_periods:
      - { weekday: 0, start_minute: 540, end_minute: 1020 }
      - { weekday: 1, start_minute: 540, end_minute: 1020 }
      - { weekday: 2, start_minute: 540, end_minute: 1020 }
      - { weekday: 3, start_minute: 540, end_minute: 1020 }
      - { weekday: 4, start_minute: 540, end_minute: 1020 }
    # Whole non-working days in the calendar's own zone. Extend per year; an
    # empty list is legitimate and means the weekly pattern is the whole story.
    holidays:
      - 2026-01-01
      - 2026-07-03
      - 2026-11-26
      - 2026-11-27
      - 2026-12-25


