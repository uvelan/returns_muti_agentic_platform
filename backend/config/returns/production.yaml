return_policy:
  photo_required_reason_codes:
    - DAMAGED
    - DEFECTIVE
    - WRONG_ITEM
  supported_product_presence:
    - PRESENT_AT_BRANCH
    - OFFSITE_CUSTOMER_RESIDENCE
    - OFFSITE_CUSTOMER_JOBSITE
    - OFFSITE_COMMERCIAL_SITE
    - OFFSITE_VENDOR_SITE
    - OFFSITE_OTHER
    - NOT_APPLICABLE
  normalized_return_methods:
    - PREPAID_PARCEL
    - BRANCH_UPS
    - BRANCH_LTL
    - OFFSITE_PARCEL
    - OFFSITE_LTL
    - DIRECT_VENDOR
    - FIELD_SCRAP
    - NO_PHYSICAL_RETURN
    - CUSTOMER_KEEP
    - UNKNOWN
  # What each return method needs before the return is business-complete.
  # `awaiting[]` is `required(method) - satisfied(case)` and `businessComplete`
  # is that difference being empty, so this table is the whole definition of
  # "done" for a return -- it sits beside the catalogue above because adding a
  # method without saying what it requires is an incomplete release.
  #
  # Three structural rules, enforced at load rather than described here:
  #   * every row must require RMA -- a method that completes without an
  #     authorization completes without a return;
  #   * no row may name UNKNOWN -- UNKNOWN is the absence of a method, and a row
  #     for it would let an undecided case complete;
  #   * a method with NO row is unmapped, which leaves the completion profile
  #     unresolved and the case awaiting RETURN_METHOD. That is the safe
  #     direction and the reason an empty `requires` list is rejected: "no row"
  #     must never read as "requires nothing".
  #
  # Dimensions: RMA, LABEL, TRACKING, BOL, PICKUP, RETURN_LOCATION.
  return_method_requirements:
    # --- Stated verbatim in the remediation plan (sect. 6.4).
    - method: PREPAID_PARCEL
      requires: [RMA, LABEL, TRACKING]
    - method: BRANCH_LTL
      requires: [RMA, BOL, PICKUP]
    - method: OFFSITE_LTL
      requires: [RMA, BOL, PICKUP, RETURN_LOCATION]
    - method: CUSTOMER_KEEP
      requires: [RMA]
    - method: NO_PHYSICAL_RETURN
      requires: [RMA]
    # --- INFERRED FROM THE CATALOGUE -- OPERATOR REVIEW REQUIRED.
    #     The four rows below were derived when the table moved out of code.
    #     The plan does not state them, so each is a reading rather than a
    #     decision, and each is wrong in a way that shows up late: too few
    #     requirements lets a return report itself complete without the
    #     paperwork, too many hangs it forever on an artifact nobody produces.
    #     Confirm each with Returns operations and delete this banner.
    #
    #     A parcel tendered at a branch: the branch is the origin, so there is
    #     no return location to establish, but there is still a label to print
    #     and a number to follow.
    - method: BRANCH_UPS
      requires: [RMA, LABEL, TRACKING]
    #     A parcel from a customer site -- BRANCH_UPS plus the location, for the
    #     same reason OFFSITE_LTL is BRANCH_LTL plus one.
    - method: OFFSITE_PARCEL
      requires: [RMA, LABEL, TRACKING, RETURN_LOCATION]
    #     Straight back to the vendor. Somebody has to say where; the carrier
    #     paperwork is the vendor's, not ours.
    - method: DIRECT_VENDOR
      requires: [RMA, RETURN_LOCATION]
    #     Scrapped where it stands. Nothing ships, so nothing but the
    #     authorization can be required -- the same shape as NO_PHYSICAL_RETURN,
    #     reached for a different reason.
    - method: FIELD_SCRAP
      requires: [RMA]
    # --- UNKNOWN has no row, and cannot have one. See the second rule above.
  # Which shipping instruction types tender a bill of lading. Recording
  # shipping instructions of one of these types emits BOL_TENDERED alongside
  # SHIPPING_INSTRUCTIONS_ISSUED, and the same set decides what the acting role
  # has to be authorized for -- the check and the act read one list.
  #
  # Carries both the instruction-type vocabulary Support uses (LTL, BOL,
  # HEAVY_TRUCK_PICKUP) and the normalized return methods above that are
  # freight (BRANCH_LTL, OFFSITE_LTL), because `shippingInstructionType` is
  # populated from either.
  bol_tendering_instruction_types:
    - LTL
    - BOL
    - BRANCH_LTL
    - OFFSITE_LTL
    - HEAVY_TRUCK_PICKUP
  rga_required_product_resolutions:
    - RTV
  heavy_pickup_required_fields:
    - address
    - contact_name
    - contact_phone
    - handling_unit_count
    - estimated_weight
    - dimensions
    - palletized
    - available_windows
  branch_staging:
    require_return_number_tag: true
    allow_manufacturer_box_marking: false
    allow_branch_inventory_addition: false

# What an associate may say about a line they are selecting (plan sect. 12.4).
#
# Top-level rather than nested inside `return_policy` on purpose. The publisher
# merges this file underneath the active release one TOP-LEVEL key at a time, so
# a key added inside `return_policy` would be dropped by the release's own
# `return_policy` and could never reach a deployment that has ever published
# (defect D11, observed with `copilot.order_discovery_agent_id`). A new
# top-level key is in no existing release, so this one arrives on the next
# publish.
#
# An empty list here means "no catalogue published", which leaves the field as
# length-bounded free text -- the behaviour before this block existed. It does
# not mean "reject everything": that would take a branch's returns offline over
# a key nobody had been asked for.
selection_vocabulary:
  # Constrained at load to `policy.vocabulary.ReturnReason`, the evaluator's own
  # closed vocabulary. A reason outside it resolves to UNKNOWN in
  # `case_policy_facts` and routes the return to a human with nothing in the
  # audit trail saying why, so the release is refused instead.
  #
  # UNKNOWN is absent and cannot be listed: it is the absence of an answer, not
  # something an associate chooses.
  reasons:
    # Delivery-related. The same four `return_eligibility_policy.delivery_claim`
    # already routes as a claim.
    - SHIPPING_DAMAGE
    - SHORTAGE
    - SHIPMENT_ERROR
    - IMPROPER_DELIVERY
    # Warranty-related. The same four `return_eligibility_policy.warranty_issue`
    # already routes to warranty verification.
    - MANUFACTURING_DEFECT
    - PRODUCT_FAILURE_AFTER_INSTALLATION
    - COVERED_PRIVATE_LABEL_DEFECT
    - MANUFACTURER_WARRANTY_ISSUE
    # Ordinary returns. These take the standard-stock path.
    - CHANGED_MIND
    - ORDERED_IN_ERROR
    - NO_LONGER_NEEDED
    - OTHER
  # --- DERIVED FROM THE ELIGIBILITY POLICY -- OPERATOR REVIEW REQUIRED.
  #     There is no condition vocabulary anywhere in code to copy, and inventing
  #     one in Python is the defect this block removes. Every entry below is
  #     instead the associate-facing name of a condition
  #     `return_eligibility_policy.standard_stock_return.requirements` already
  #     reads: the five `condition` facts and the eight `prohibited_states`.
  #     They are a reading of that table, not a decision Returns operations has
  #     taken. Confirm the wording with the counter staff who will pick from it
  #     and delete this banner.
  #
  #     Deleting an entry is safe -- an associate can no longer choose it.
  #     Adding one is safe too: nothing downstream branches on a condition, so
  #     the value is recorded and read by a human.
  conditions:
    # Satisfies the resale requirements: new, suitable for resale, original
    # packaging, packaging undamaged, all original parts.
    - NEW_IN_ORIGINAL_PACKAGING
    # New, but the packaging no longer proves it.
    - NEW_PACKAGING_OPENED
    - NEW_PACKAGING_DAMAGED
    - MISSING_ORIGINAL_PARTS
    # The eight prohibited states, one entry each, so an associate naming the
    # state names the one the policy refuses on.
    - USED
    - INSTALLED
    - MODIFIED
    - REBUILT
    - RECONDITIONED
    - REPAIRED
    - ALTERED
    - DAMAGED

