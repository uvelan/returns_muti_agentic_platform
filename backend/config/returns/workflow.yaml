workflow:
  version: "2.0"
  stages:
    - INTAKE
    - ORDER_DISCOVERY
    - ORDER_CONFIRMATION
    - RETURN_DETAILS
    - SUPPORT_REQUEST
    - RETURN_CREATION
    - PHYSICAL_RETURN_SETUP
    - RETURN_SHIPMENT
    - RECEIPT
    - CUSTOMER_RESOLUTION
    - PRODUCT_DISPOSITION
    - WAREHOUSE_PROCESSING
    - CUSTOMER_RETURN_COMPLETE
    - VENDOR_RECOVERY
    - FULLY_CLOSED
  sla_minutes:
    support_acknowledgement: 5
    support_clarification: 30
    return_creation: 1440
    shipping_instructions: 7200
    pickup_scheduling: 2880
  completion_dimensions:
    - customer_resolution_complete
    - physical_return_complete
    - warehouse_processing_complete
    - vendor_recovery_complete
    - case_fully_closed

# How long a case waits and how often it chases. Every value is editable
# through a configuration release; a running workflow keeps the values it
# started with, so changes apply to new cases rather than moving a deadline
# under a return already waiting on it.
return_case:
  # Bay is advisory and sits in front of every return, so this is dead time on
  # the critical path before the Support handoff can begin. Deliberately short.
  bay_wait_seconds: 120
  # A Support request nobody has described is a task a human cannot act on.
  #
  # The default is false, which opens the thread the moment the case is cleared
  # and lets the detail follow -- and what Support received was a request whose
  # own verification block read "Required Return Information: Incomplete", with
  # no reason, no quantity and no condition, while the associate was still being
  # asked for them in the chat. The first thing the human does with that is come
  # back and ask.
  #
  # Turning it on is an operator's decision, which is why it defaults off, and
  # this deployment is making it: wait for the description, and park rather than
  # hand over a return nobody finished describing. The wait is satisfied by any
  # surface that records a detail -- the item pane, the conversation, an
  # operator -- and the case is asked directly, so answering the agent's
  # question in chat counts.
  return_details_required: true
  # The same thirty minutes as the reservation hold above, and for the same
  # reason: they bound one live counter conversation from two directions, and a
  # selection whose hold has expired is a selection the associate is no longer
  # making.
  return_details_wait_seconds: 1800
  # How long a selected line's quantity is held for this case before the hold
  # expires and the units go back to everyone else (plan sect. 12.3). Wall
  # clock, not business hours: it bounds a live counter conversation, and a
  # hold that survived a weekend would make Monday's associate wait for
  # Friday's abandoned one. Thirty minutes.
  item_reservation_ttl_seconds: 1800
  # Business hours, not wall clock -- eight hours over a weekend is a different
  # instant entirely. `business_calendar_id` names the calendar that decides.
  #
  # DEV SETTING (2026-08-15, operator decision: "change to ttl seconds in dev").
  # Set equal to `item_reservation_ttl_seconds` above, to close the overselling
  # window described in D46: the availability formula counts only ACTIVE holds
  # and RMA-covered items, so between a hold lapsing and Support answering the
  # units belonged to neither and a second case could be authorized for them.
  # At 28800 against a 30-minute hold that window was hours, and up to ~72
  # wall-clock hours across a weekend.
  #
  # This value alone is NOT sufficient -- it is measured on the business
  # calendar while the TTL is wall clock, so outside 09:00-17:00 it would still
  # stretch. `business_calendars.default` is therefore ALSO set to 24/7 below,
  # which the calendar's own documentation names as the way to get wall-clock
  # behaviour back exactly. The two changes only work together.
  #
  # BEFORE LIVE: restore 28800 (or the desk's real SLA) and restore the real
  # Mon-Fri calendar. A 30-minute Support SLA is not a real-world commitment;
  # the production answer to D46 is a fourth term in the availability formula
  # for "selected but not yet authorized", not a shortened SLA.
  support_response_wait_seconds: 1800
  reminder_interval_seconds: 7200
  max_reminders: 3
  # A reminder cap with no terminal branch leaves the case sitting forever with
  # nobody told.
  on_reminders_exhausted: PARK_FOR_OPERATIONS
  business_calendar_id: default
  timezone: UTC

# When the support desk is open. Declared, never assumed: there is no Mon-Fri
# anywhere in the code that reads this, so a deployment whose desk works
# Saturdays adds a Saturday period and gets one, and a 24/7 operation declares
# every day 0..1440 and gets wall-clock behaviour back exactly.
#
# `weekday` is Monday-0. `end_minute` is exclusive, so 1020 is 17:00 and 1440
# is midnight at the end of the day.
business_calendars:
  - calendar_id: default
    # The desk's own zone. `return_case.timezone` is only a fallback for a
    # calendar that declares none -- a holiday has to fall on the same day for
    # every reader whatever zone the worker computing it runs in.
    timezone: America/New_York
    # DEV SETTING (2026-08-15) -- 24/7, i.e. every day 0..1440. This is the
    # mechanism this file's own header names: "a 24/7 operation declares every
    # day 0..1440 and gets wall-clock behaviour back exactly."
    #
    # It exists to make `support_response_wait_seconds: 1800` mean thirty
    # *wall-clock* minutes, matching `item_reservation_ttl_seconds`. Without it
    # the two clocks disagree and D46's overselling window reopens outside
    # office hours -- which, for a dev stack worked on at any hour, is most of
    # the time.
    #
    # Blast radius, stated rather than discovered later: every deadline and
    # reminder computed on this calendar becomes wall clock too. In dev that is
    # the point -- nothing should sit until Monday.
    #
    # BEFORE LIVE: restore the Mon-Fri 540..1020 pattern below, together with
    # `support_response_wait_seconds: 28800`.
    working_periods:
      - { weekday: 0, start_minute: 0, end_minute: 1440 }
      - { weekday: 1, start_minute: 0, end_minute: 1440 }
      - { weekday: 2, start_minute: 0, end_minute: 1440 }
      - { weekday: 3, start_minute: 0, end_minute: 1440 }
      - { weekday: 4, start_minute: 0, end_minute: 1440 }
      - { weekday: 5, start_minute: 0, end_minute: 1440 }
      - { weekday: 6, start_minute: 0, end_minute: 1440 }
    # The real Mon-Fri desk, kept here so restoring it is a copy rather than a
    # reconstruction:
    #   - { weekday: 0, start_minute: 540, end_minute: 1020 }
    #   - { weekday: 1, start_minute: 540, end_minute: 1020 }
    #   - { weekday: 2, start_minute: 540, end_minute: 1020 }
    #   - { weekday: 3, start_minute: 540, end_minute: 1020 }
    #   - { weekday: 4, start_minute: 540, end_minute: 1020 }
    #
    # Whole non-working days in the calendar's own zone. Extend per year; an
    # empty list is legitimate and means the weekly pattern is the whole story.
    # Emptied in dev for the same reason: a holiday is a day nothing progresses.
    holidays: []
    # The real holiday list, for restoration:
    #   2026-01-01, 2026-07-03, 2026-11-26, 2026-11-27, 2026-12-25


