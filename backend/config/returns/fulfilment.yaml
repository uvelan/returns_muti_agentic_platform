omc:
  v2_customer_return_table: omc.returns.returnMerchandiseAuthorization
  v1_customer_return_table: omc.dbo.returns
  customer_return_display:
    V2: "RMA {id}"
    V1: "Return {id}"
  normalized_statuses:
    REQUESTED: IN_PROGRESS
    ENTERED: IN_PROGRESS
    ISSUED: IN_PROGRESS
    PROCESSED: PHYSICAL_COMPLETE
    CREDITED: CUSTOMER_RESOLUTION_COMPLETE
    REFUNDED: CUSTOMER_RESOLUTION_COMPLETE
    DENIED: REJECTED
    CANCELLED: CANCELLED
  tendered_is_pickup: false
  license_plate_implies_receipt: true
  rga_is_customer_return: false

bay:
  authority_mode: PROJECTION
  # Pre-arrival placement is allowed: the case asks for a bay at creation, so
  # the recommendation has to be producible before the goods exist to
  # receive. `AWAITING_RECEIPT` is the pre-arrival status
  # (`case_placement.PRE_ARRIVAL_STATUS`) and is eligible for the same reason.
  require_physical_receipt: false
  allow_prearrival_reservation: true
  eligible_statuses:
    - AWAITING_RECEIPT
    - WAREHOUSE_RECEIVED
    - INSPECTION_COMPLETE

# The return-shipment status catalog. Two ladders, because the product decides
# parcel vs freight; every code, label, transition and colour is operator
# configuration -- a status code appearing in Python or JSX is a defect.
shipment_tracking:
  initial_status_parcel: label_created
  initial_status_freight: bol_created
  freight_methods:
    - BRANCH_LTL
    - OFFSITE_LTL
  collection: shipmentInfo
  fields: {}
  # The graph reads this collection as the carrier feed (`source_shipments`,
  # active schema entity `shipment`): tracking under
  # shipmentInfoEventData.trkNum, status under .currentStatus, the change
  # cursor under shipmentInfoEventMeta.lastUpdateTs. A return shipment the
  # console seeds is mirrored into that shape so the targeted sync finds it
  # and the case's own reading of the parcel can move past AWAITING_HANDOFF.
  source_mirror:
    shipmentInfoEventData.trkNum: tracking_reference
    shipmentInfoEventData.currentStatus: current_status
    shipmentInfoEventData.shipmentId: shipment_id
    shipmentInfoEventData.trilOrdNum: rma_reference
    shipmentInfoEventMeta.lastUpdateTs: updated_at
  source_constants:
    shipmentInfoEventData.srcSystem: RETURN_PLATFORM
  statuses:
    # ---- parcel ladder -----------------------------------------------------
    - code: label_created
      projection_status: AWAITING_HANDOFF
      label: Label created
      ladder: parcel
      ordinal: 0
      color_token: progress
      allowed_next: [picked_up, exception, return_to_sender]
    - code: picked_up
      projection_status: IN_TRANSIT
      label: Picked up
      ladder: parcel
      ordinal: 1
      color_token: progress
      allowed_next: [in_transit, exception, return_to_sender]
    - code: in_transit
      projection_status: IN_TRANSIT
      label: In transit
      ladder: parcel
      ordinal: 2
      color_token: progress
      allowed_next: [arrived_at_facility, out_for_delivery, exception, return_to_sender]
    # The carrier's sort hub, not our warehouse: a parcel can arrive here more
    # than once on a multi-leg journey (hence `in_transit` in allowed_next),
    # and it is still moving as far as the case is concerned. The last leg to
    # warehouse 628 is `out_for_delivery`, and arrival at our dock is
    # `delivered`. Labelled to say so, because "facility" read as ours.
    - code: arrived_at_facility
      projection_status: IN_TRANSIT
      label: At carrier hub
      ladder: parcel
      ordinal: 3
      color_token: progress
      allowed_next: [in_transit, out_for_delivery, exception, return_to_sender]
    - code: out_for_delivery
      projection_status: IN_TRANSIT
      label: Out for delivery
      ladder: parcel
      ordinal: 4
      color_token: progress
      allowed_next: [delivered, delivery_attempted, exception, return_to_sender]
    - code: delivered
      projection_status: DELIVERED
      label: Delivered
      ladder: parcel
      ordinal: 5
      terminal: true
      color_token: success
      allowed_next: []
    - code: delivery_attempted
      projection_status: IN_TRANSIT
      label: Delivery attempted
      ladder: parcel
      ordinal: 4
      exception_state: true
      color_token: warning
      allowed_next: [out_for_delivery, in_transit, exception, return_to_sender]
    - code: exception
      projection_status: IN_TRANSIT
      label: Exception
      ladder: parcel
      ordinal: 2
      exception_state: true
      color_token: error
      allowed_next: [picked_up, in_transit, arrived_at_facility, out_for_delivery, return_to_sender]
    # The carrier could not deliver -- refused, undeliverable, damaged in
    # transit -- and is carrying the parcel back to whoever tendered it: the
    # customer or the branch. Terminal for this parcel and CANCELLED to the
    # case, which therefore keeps awaiting receipt until a new parcel is
    # tendered under the same RMA or the return is closed another way.
    - code: return_to_sender
      projection_status: CANCELLED
      label: Sent back to sender
      ladder: parcel
      ordinal: 5
      terminal: true
      color_token: error
      allowed_next: []
    # ---- freight / LTL ladder ----------------------------------------------
    - code: bol_created
      projection_status: AWAITING_HANDOFF
      label: BOL created
      ladder: freight
      ordinal: 0
      color_token: progress
      allowed_next: [pending_pickup, exception]
    - code: pending_pickup
      projection_status: AWAITING_HANDOFF
      label: Pending pickup
      ladder: freight
      ordinal: 1
      color_token: progress
      allowed_next: [picked_up, exception]
    - code: picked_up
      projection_status: IN_TRANSIT
      label: Picked up
      ladder: freight
      ordinal: 2
      color_token: progress
      allowed_next: [at_origin_terminal, exception, on_hand]
    - code: at_origin_terminal
      projection_status: IN_TRANSIT
      label: At origin terminal
      ladder: freight
      ordinal: 3
      color_token: progress
      allowed_next: [in_transit, on_hand, exception]
    - code: in_transit
      projection_status: IN_TRANSIT
      label: In transit
      ladder: freight
      ordinal: 4
      color_token: progress
      allowed_next: [at_destination_terminal, on_hand, exception]
    - code: at_destination_terminal
      projection_status: IN_TRANSIT
      label: At destination terminal
      ladder: freight
      ordinal: 5
      color_token: progress
      allowed_next: [out_for_delivery, on_hand, exception]
    - code: out_for_delivery
      projection_status: IN_TRANSIT
      label: Out for delivery
      ladder: freight
      ordinal: 6
      color_token: progress
      allowed_next: [delivered, on_hand, exception]
    - code: delivered
      projection_status: DELIVERED
      label: Delivered
      ladder: freight
      ordinal: 7
      terminal: true
      color_token: success
      allowed_next: []
    - code: on_hand
      projection_status: DELIVERED
      label: On hand at terminal
      ladder: freight
      ordinal: 4
      exception_state: true
      color_token: warning
      allowed_next: [in_transit, at_destination_terminal, out_for_delivery, exception]
    - code: exception
      projection_status: IN_TRANSIT
      label: Exception
      ladder: freight
      ordinal: 4
      exception_state: true
      color_token: error
      allowed_next: [pending_pickup, picked_up, at_origin_terminal, in_transit, at_destination_terminal, out_for_delivery, on_hand]

