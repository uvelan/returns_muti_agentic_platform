owner: RETURN_PLATFORM_ORCHESTRATION
status: DRAFT
dependencies: []
payload:
  context_only_handoffs: true
  direct_agent_calls_allowed: true
  stages:
    - stage: DISPATCH
      handler:
        type: AGENT
        agent: order_discovery
