# Reference fixture proving the stage/handler config engine's AGENT-handler
# capability end to end (Wave B3). This module does not describe any live
# return-processing flow -- see `return_session.yaml` for that, and for why
# its own stages are still ACTIVITY-typed. This one exists so
# `tests/configuration/test_workflow_agent_handler_resolution.py` can prove,
# against the real manifest/loader/validator pipeline and the real
# AgentRegistry, that a configured workflow can resolve an agent
# implementation through the canonical registry under a pinned configuration
# release.
module_id: workflow.example_agent_dispatch
